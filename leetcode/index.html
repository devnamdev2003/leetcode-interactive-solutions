<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My LeetCode Journey</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config for Custom Colors/Fonts -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        slate: {
                            850: '#151e2e',
                            900: '#0f172a',
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.1) 0, transparent 50%);
            background-attachment: fixed;
        }

        /* Custom Global Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Custom Scrollbar for Dropdowns */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Glassmorphism utility */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

    <div class="max-w-6xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
        
        <!-- Header -->
        <header class="mb-12 animate-fade-in-up">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
                <div>
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full glass text-indigo-400 text-sm font-medium mb-4">
                        <i data-lucide="code-2" class="w-4 h-4"></i>
                        <span>Algorithm & Data Structures</span>
                    </div>
                    <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-2">
                        My <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-400 to-rose-400">LeetCode</span> Sheet
                    </h1>
                    <p class="text-slate-400 text-lg max-w-2xl">
                        A modern repository of my solved problems, conceptual notes, and external references to master coding interviews.
                    </p>
                </div>

                <!-- Stats Overview -->
                <div class="flex gap-4">
                    <div class="glass px-5 py-3 rounded-2xl border-t border-t-emerald-500/30">
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider mb-1">Easy</p>
                        <p class="text-2xl font-bold text-emerald-400" id="count-easy">0</p>
                    </div>
                    <div class="glass px-5 py-3 rounded-2xl border-t border-t-amber-500/30">
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider mb-1">Medium</p>
                        <p class="text-2xl font-bold text-amber-400" id="count-medium">0</p>
                    </div>
                    <div class="glass px-5 py-3 rounded-2xl border-t border-t-rose-500/30">
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider mb-1">Hard</p>
                        <p class="text-2xl font-bold text-rose-400" id="count-hard">0</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Controls (Search & Filter) -->
        <div class="mb-8 flex flex-col md:flex-row gap-4 animate-fade-in-up relative z-30" style="animation-delay: 0.1s;">
            <!-- Search Bar -->
            <div class="relative flex-grow">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Search problems, tags, or topics..." 
                    class="block w-full pl-10 pr-3 py-3 border border-slate-700 rounded-xl leading-5 bg-slate-800/50 text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all sm:text-sm glass">
            </div>
            
            <!-- Custom Dropdowns & Reset -->
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                
                <!-- Custom Difficulty Dropdown -->
                <div class="relative w-full sm:w-48">
                    <button onclick="toggleDiffMenu(event)" id="diff-btn" class="flex items-center justify-between w-full pl-4 pr-3 py-3 text-base border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-slate-800/50 text-slate-200 glass transition-all shadow-sm">
                        <span id="diff-selected-text" class="truncate">All Difficulties</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform duration-200" id="diff-chevron"></i>
                    </button>
                    <div id="diff-menu" class="hidden absolute z-50 w-full mt-2 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden transition-all duration-200 glass origin-top">
                        <ul class="max-h-60 overflow-y-auto py-1.5 custom-scrollbar outline-none">
                            <li onclick="selectDifficulty(event, 'All', 'All Difficulties')" class="cursor-pointer px-4 py-2.5 hover:bg-slate-700/50 text-slate-200 text-sm transition-colors flex items-center justify-between group diff-option" data-value="All">
                                <span>All Difficulties</span> <i data-lucide="check" class="w-4 h-4 text-indigo-400 check-icon"></i>
                            </li>
                            <li onclick="selectDifficulty(event, 'Easy', 'Easy')" class="cursor-pointer px-4 py-2.5 hover:bg-slate-700/50 text-emerald-400 text-sm transition-colors flex items-center justify-between group diff-option" data-value="Easy">
                                <span>Easy</span> <i data-lucide="check" class="w-4 h-4 text-transparent check-icon"></i>
                            </li>
                            <li onclick="selectDifficulty(event, 'Medium', 'Medium')" class="cursor-pointer px-4 py-2.5 hover:bg-slate-700/50 text-amber-400 text-sm transition-colors flex items-center justify-between group diff-option" data-value="Medium">
                                <span>Medium</span> <i data-lucide="check" class="w-4 h-4 text-transparent check-icon"></i>
                            </li>
                            <li onclick="selectDifficulty(event, 'Hard', 'Hard')" class="cursor-pointer px-4 py-2.5 hover:bg-slate-700/50 text-rose-400 text-sm transition-colors flex items-center justify-between group diff-option" data-value="Hard">
                                <span>Hard</span> <i data-lucide="check" class="w-4 h-4 text-transparent check-icon"></i>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Custom Tag Dropdown -->
                <div class="relative w-full sm:w-56">
                    <button onclick="toggleTagMenu(event)" id="tag-btn" class="flex items-center justify-between w-full pl-4 pr-3 py-3 text-base border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-slate-800/50 text-slate-200 glass transition-all shadow-sm">
                        <span id="tag-selected-text" class="truncate">All Tags</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform duration-200" id="tag-chevron"></i>
                    </button>
                    <div id="tag-menu" class="hidden absolute z-50 w-full mt-2 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden transition-all duration-200 glass origin-top">
                        <ul id="tag-menu-list" class="max-h-60 overflow-y-auto py-1.5 custom-scrollbar outline-none">
                            <!-- Populated dynamically by JS -->
                        </ul>
                    </div>
                </div>

                <!-- Reset Filters Button -->
                <button onclick="resetFilters()" class="flex items-center justify-center gap-2 px-4 py-3 bg-slate-800/50 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-400 hover:text-slate-200 text-sm transition-all shadow-sm glass focus:outline-none focus:ring-2 focus:ring-slate-500 tooltip-trigger" title="Reset all filters">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span class="sm:hidden lg:inline font-medium">Reset</span>
                </button>

            </div>
        </div>

        <!-- Problem List -->
        <div id="problemList" class="space-y-2 pb-20 relative z-10">
            <!-- Items injected by JS -->
        </div>

    </div>

    <!-- Application Logic & Data -->
    <script>
        // State
        let problemData = [];
        let currentFilter = 'All';
        let selectedTags = [];
        let searchQuery = '';
        let isDiffOpen = false;
        let isTagOpen = false;

        // DOM Elements
        const listContainer = document.getElementById('problemList');
        const searchInput = document.getElementById('searchInput');

        // Helper: Get Difficulty Styling
        function getDifficultyClasses(difficulty) {
            switch(difficulty) {
                case 'Easy': return 'text-emerald-400 bg-emerald-400/10 border-emerald-400/20';
                case 'Medium': return 'text-amber-400 bg-amber-400/10 border-amber-400/20';
                case 'Hard': return 'text-rose-400 bg-rose-400/10 border-rose-400/20';
                default: return 'text-slate-400 bg-slate-400/10 border-slate-400/20';
            }
        }

        // Initialize and Update Stats
        function updateStats() {
            const counts = { Easy: 0, Medium: 0, Hard: 0 };
            problemData.forEach(p => { if (counts[p.difficulty] !== undefined) counts[p.difficulty]++; });
            
            document.getElementById('count-easy').innerText = counts.Easy;
            document.getElementById('count-medium').innerText = counts.Medium;
            document.getElementById('count-hard').innerText = counts.Hard;
        }

        // --- Custom Dropdown Logic ---
        
        // Dynamically extract and populate tags into the custom UI list
        function populateTags() {
            const allTags = new Set();
            problemData.forEach(p => {
                p.tags.forEach(tag => allTags.add(tag));
            });
            
            const sortedTags = Array.from(allTags).sort();
            const tagList = document.getElementById('tag-menu-list');
            
            // Default 'All Tags' option
            let html = `
                <li onclick="toggleTagSelect(event, 'All')" class="cursor-pointer px-4 py-2.5 hover:bg-slate-700/50 text-slate-200 text-sm transition-colors flex items-center justify-between group tag-option" data-value="All">
                    <span>All Tags</span> <i data-lucide="check" class="w-4 h-4 text-indigo-400 check-icon"></i>
                </li>
            `;
            
            // Generated Tag options
            sortedTags.forEach(tag => {
                html += `
                    <li onclick="toggleTagSelect(event, '${tag}')" class="cursor-pointer px-4 py-2.5 hover:bg-slate-700/50 text-slate-300 text-sm transition-colors flex items-center justify-between group tag-option" data-value="${tag}">
                        <span>${tag}</span> <i data-lucide="check" class="w-4 h-4 text-transparent check-icon"></i>
                    </li>
                `;
            });
            
            tagList.innerHTML = html;
            // Initialize lucide icons within the newly added html
            lucide.createIcons();
        }

        function toggleDiffMenu(e) {
            e.stopPropagation();
            isDiffOpen = !isDiffOpen;
            isTagOpen = false; // Close the other dropdown
            renderDropdownState();
        }

        function toggleTagMenu(e) {
            e.stopPropagation();
            isTagOpen = !isTagOpen;
            isDiffOpen = false; // Close the other dropdown
            renderDropdownState();
        }

        function renderDropdownState() {
            const diffMenu = document.getElementById('diff-menu');
            const diffChevron = document.getElementById('diff-chevron');
            const tagMenu = document.getElementById('tag-menu');
            const tagChevron = document.getElementById('tag-chevron');

            // Difficulty Menu
            if (isDiffOpen) {
                diffMenu.classList.remove('hidden');
                diffChevron.style.transform = 'rotate(180deg)';
            } else {
                diffMenu.classList.add('hidden');
                diffChevron.style.transform = 'rotate(0deg)';
            }

            // Tag Menu
            if (isTagOpen) {
                tagMenu.classList.remove('hidden');
                tagChevron.style.transform = 'rotate(180deg)';
            } else {
                tagMenu.classList.add('hidden');
                tagChevron.style.transform = 'rotate(0deg)';
            }
        }

        // Click outside closes dropdowns
        document.addEventListener('click', () => {
            if (isDiffOpen || isTagOpen) {
                isDiffOpen = false;
                isTagOpen = false;
                renderDropdownState();
            }
        });

        // Handle item selection in Difficulty Dropdown
        function selectDifficulty(e, value, text) {
            if (e) e.stopPropagation();
            currentFilter = value;
            document.getElementById('diff-selected-text').innerText = text;
            
            // Update active styling/checkmarks
            document.querySelectorAll('.diff-option').forEach(el => {
                const icon = el.querySelector('.check-icon');
                if (el.dataset.value === value) {
                    icon.classList.remove('text-transparent');
                    icon.classList.add('text-indigo-400');
                } else {
                    icon.classList.add('text-transparent');
                    icon.classList.remove('text-indigo-400');
                }
            });
            
            isDiffOpen = false;
            renderDropdownState();
            renderProblems();
        }

        // Handle Multi-Select for Tags
        function toggleTagSelect(e, tag) {
            if (e) e.stopPropagation(); // Keep menu open when selecting tags
            
            if (tag === 'All') {
                selectedTags = [];
            } else {
                const index = selectedTags.indexOf(tag);
                if (index > -1) {
                    selectedTags.splice(index, 1); // Remove if already selected
                } else {
                    selectedTags.push(tag); // Add if not selected
                }
            }

            // Update Button Text
            const tagText = document.getElementById('tag-selected-text');
            if (selectedTags.length === 0) {
                tagText.innerText = 'All Tags';
            } else if (selectedTags.length === 1) {
                tagText.innerText = selectedTags[0];
            } else {
                tagText.innerText = `${selectedTags.length} Tags Selected`;
            }

            // Update Checkmarks in UI
            document.querySelectorAll('.tag-option').forEach(el => {
                const icon = el.querySelector('.check-icon');
                const val = el.dataset.value;
                
                if (val === 'All' && selectedTags.length === 0) {
                    icon.classList.remove('text-transparent');
                    icon.classList.add('text-indigo-400');
                } else if (val !== 'All' && selectedTags.includes(val)) {
                    icon.classList.remove('text-transparent');
                    icon.classList.add('text-indigo-400');
                } else {
                    icon.classList.add('text-transparent');
                    icon.classList.remove('text-indigo-400');
                }
            });
            
            renderProblems();
        }

        // Reset all filters
        function resetFilters() {
            // Reset Search
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            
            // Reset Dropdowns Logic
            selectDifficulty(null, 'All', 'All Difficulties');
            toggleTagSelect(null, 'All');
            
            // Ensure Menus are closed
            isDiffOpen = false;
            isTagOpen = false;
            renderDropdownState();
        }


        // --- List Rendering logic ---

        function renderProblems() {
            const filteredData = problemData.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      p.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
                const matchesDiffFilter = currentFilter === 'All' || p.difficulty === currentFilter;
                
                // If no tags selected, match all. Otherwise, match if problem has ANY of the selected tags (OR Logic)
                const matchesTagFilter = selectedTags.length === 0 || selectedTags.some(t => p.tags.includes(t));
                
                return matchesSearch && matchesDiffFilter && matchesTagFilter;
            });

            if (filteredData.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 glass rounded-2xl border-dashed border-2 border-slate-700">
                        <i data-lucide="ghost" class="w-12 h-12 text-slate-500 mx-auto mb-4"></i>
                        <p class="text-slate-400 text-lg">No problems found matching your criteria.</p>
                    </div>`;
            } else {
                listContainer.innerHTML = filteredData.map((p, index) => {
                    const diffClass = getDifficultyClasses(p.difficulty);
                    const animationDelay = index * 0.02; // Faster staggered animation

                    return `
                        <div class="glass rounded-xl border border-slate-700/50 hover:border-slate-500 hover:bg-slate-800/40 transition-all duration-200 animate-fade-in-up group flex flex-col sm:flex-row sm:items-center justify-between p-3 sm:p-4 gap-3 sm:gap-4" style="animation-delay: ${animationDelay}s;">
                            
                            <!-- Left Section: Checkmark, Title & Difficulty -->
                            <div class="flex items-center gap-3 sm:gap-4 flex-grow min-w-0">
                                <div class="flex-shrink-0 w-6 h-6 rounded-full bg-emerald-500/10 flex items-center justify-center border border-emerald-500/20 text-emerald-400 group-hover:bg-emerald-500/20 group-hover:scale-110 transition-all">
                                    <i data-lucide="check" class="w-3.5 h-3.5"></i>
                                </div>
                                <div class="flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-3 min-w-0 flex-grow">
                                    <h3 class="text-base font-medium text-slate-200 truncate group-hover:text-white transition-colors">
                                        ${p.title}
                                    </h3>
                                    <div class="flex items-center gap-2">
                                        <span class="px-2 py-0.5 rounded text-[10px] uppercase tracking-wider font-bold border ${diffClass} flex-shrink-0">
                                            ${p.difficulty}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <!-- Middle Section: Tags (Visible on md and up) -->
                            <div class="hidden md:flex flex-wrap items-center justify-end gap-1.5 w-1/3 flex-shrink-0">
                                ${p.tags.slice(0, 3).map(tag => `<span class="px-1.5 py-0.5 rounded bg-slate-800/80 text-slate-400 text-[10px] font-mono border border-slate-700/80">${tag}</span>`).join('')}
                                ${p.tags.length > 3 ? `<span class="text-slate-600 text-xs" title="${p.tags.slice(3).join(', ')}">...</span>` : ''}
                            </div>

                            <!-- Right Section: Actions -->
                            <div class="flex items-center justify-end gap-1 sm:gap-2 flex-shrink-0">
                                <a href="${p.leetcodeUrl}" target="_blank" rel="noopener noreferrer" 
                                   class="flex items-center gap-1.5 p-2 sm:px-3 sm:py-1.5 rounded-lg text-slate-400 hover:text-amber-400 hover:bg-amber-400/10 border border-transparent hover:border-amber-400/20 transition-all tooltip-trigger" title="View on LeetCode">
                                    <i data-lucide="code" class="w-4 h-4"></i>
                                    <span class="text-xs font-medium hidden lg:block">LeetCode</span>
                                </a>
                                <a href="${p.algovizUrl}" target="_blank" rel="noopener noreferrer"
                                   class="flex items-center gap-1.5 p-2 sm:px-3 sm:py-1.5 rounded-lg text-slate-400 hover:text-indigo-400 hover:bg-indigo-500/10 border border-transparent hover:border-indigo-500/20 transition-all" title="View on AlgoViz">
                                    <i data-lucide="globe" class="w-4 h-4"></i>
                                    <span class="text-xs font-medium hidden lg:block">AlgoViz</span>
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Re-initialize icons for newly rendered elements
            lucide.createIcons();
        }

        // Search Bar Event Listener
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderProblems();
        });

        // Initialize App by fetching data.json
        async function initApp() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                
                problemData = await response.json();
                
                updateStats();
                populateTags();
                renderProblems();
            } catch (error) {
                console.error("Error loading data.json:", error);
                listContainer.innerHTML = `
                    <div class="text-center py-12 glass rounded-2xl border-dashed border-2 border-rose-700/50">
                        <i data-lucide="alert-circle" class="w-12 h-12 text-rose-500 mx-auto mb-4"></i>
                        <p class="text-slate-300 text-lg">Error loading data.json</p>
                        <p class="text-slate-500 text-sm mt-2 max-w-md mx-auto">Make sure you are running this through a local web server (like VS Code Live Server). Fetching local files directly via double-clicking the HTML file is blocked by browsers for security reasons.</p>
                    </div>`;
                lucide.createIcons();
            }
        }

        initApp();

    </script>
</body>
</html>
