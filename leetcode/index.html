<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo Flows</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        zinc: {
                            850: '#202024',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    },
                    animation: {
                        'slide-in-right': 'slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards',
                        'fade-in': 'fadeIn 0.2s ease-out forwards',
                    },
                    keyframes: {
                        slideInRight: {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #09090b; /* Zinc 950 */
            color: #f4f4f5;
        }

        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Hide scrollbar for chip lists but allow scrolling */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25em;
            height: 1.25em;
            border: 2px solid #52525b;
            border-radius: 0.35em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            background-color: #09090b;
            transition: 120ms transform ease-in-out;
        }
        .custom-checkbox:checked {
            background-color: #10b981; /* Emerald 500 */
            border-color: #10b981;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* Circular Progress */
        .circular-chart { display: block; margin: 0 auto; max-width: 80%; max-height: 250px; }
        .circle-bg { fill: none; stroke: #27272a; stroke-width: 3.8; }
        .circle { 
            fill: none; 
            stroke-width: 2.8; 
            stroke-linecap: round; 
            transition: stroke-dasharray 1s ease-out;
        }
        
        .form-input {
            width: 100%;
            background: #18181b;
            border: 1px solid #3f3f46;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            color: #f4f4f5;
            transition: all 0.2s;
            font-size: 0.875rem;
        }
        .form-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
    </style>
</head>

<body class="h-screen w-full antialiased flex flex-col md:flex-row overflow-hidden selection:bg-indigo-500/30">

    <!-- Mobile Header -->
    <header class="md:hidden flex items-center justify-between p-4 border-b border-zinc-800 bg-zinc-950/80 backdrop-blur z-20 flex-shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center border border-indigo-500/30 text-indigo-400">
                <i data-lucide="terminal" class="w-4 h-4"></i>
            </div>
            <h1 class="font-bold text-lg tracking-tight">DSA<span class="text-indigo-400">Tracker</span></h1>
        </div>
        <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" class="p-2 text-zinc-400 hover:text-white bg-zinc-900 rounded-lg border border-zinc-800">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- Sidebar / Stats Panel -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-zinc-950 border-r border-zinc-800 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col h-full max-h-screen">
        <div class="p-6 hidden md:flex items-center gap-3 flex-shrink-0">
            <div class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center border border-indigo-500/20 text-indigo-400 shadow-inner">
                <i data-lucide="code-2" class="w-5 h-5"></i>
            </div>
            <h1 class="font-extrabold text-xl tracking-tight">Algo<span class="text-indigo-400">Flows</span></h1>
        </div>

        <div class="flex-1 overflow-y-auto p-6 pt-0 md:pt-2 space-y-8 custom-scrollbar pb-10">
            
            <!-- Progress Section -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Your Progress</h2>
                    <button onclick="resetProgress()" class="text-zinc-500 hover:text-rose-400 transition-colors bg-zinc-900/50 hover:bg-rose-500/10 p-1.5 rounded-md border border-zinc-800/50 hover:border-rose-500/30" title="Reset All Progress">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
                <div class="relative flex items-center justify-center bg-zinc-900/50 rounded-2xl p-4 border border-zinc-800/50">
                    <svg viewBox="0 0 36 36" class="circular-chart w-32 h-32">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle stroke-indigo-500" stroke-dasharray="0, 100" id="progress-circle" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div class="absolute flex flex-col items-center justify-center">
                        <span class="text-2xl font-bold text-white" id="progress-percent">0%</span>
                        <span class="text-[10px] text-zinc-400 font-medium">Completed</span>
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div>
                <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-4">Difficulty Stats</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-zinc-900 rounded-xl p-3 border border-zinc-800 flex flex-col justify-center cursor-pointer hover:border-zinc-600 transition" onclick="setDiffFilter('All')">
                        <span class="text-xl font-bold text-white" id="stat-total">0</span>
                        <span class="text-[11px] text-zinc-400">Total Problems</span>
                    </div>
                    <div class="bg-emerald-500/5 rounded-xl p-3 border border-emerald-500/10 flex flex-col justify-center cursor-pointer hover:border-emerald-500/30 transition" onclick="setDiffFilter('Easy')">
                        <span class="text-xl font-bold text-emerald-400" id="stat-easy">0</span>
                        <span class="text-[11px] text-emerald-500/70">Easy</span>
                    </div>
                    <div class="bg-amber-500/5 rounded-xl p-3 border border-amber-500/10 flex flex-col justify-center cursor-pointer hover:border-amber-500/30 transition" onclick="setDiffFilter('Medium')">
                        <span class="text-xl font-bold text-amber-400" id="stat-medium">0</span>
                        <span class="text-[11px] text-amber-500/70">Medium</span>
                    </div>
                    <div class="bg-rose-500/5 rounded-xl p-3 border border-rose-500/10 flex flex-col justify-center cursor-pointer hover:border-rose-500/30 transition" onclick="setDiffFilter('Hard')">
                        <span class="text-xl font-bold text-rose-400" id="stat-hard">0</span>
                        <span class="text-[11px] text-rose-500/70">Hard</span>
                    </div>
                </div>
            </div>

            <!-- Primary Filters Sidebar -->
            <div>
                <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-4">Completion</h2>
                <div class="flex flex-col gap-2">
                    <button onclick="setStatusFilter('All')" id="btn-status-all" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors bg-zinc-800 text-white font-medium">
                        <span>All Problems</span> <span id="count-all-badge" class="bg-zinc-700 px-2 py-0.5 rounded text-xs">0</span>
                    </button>
                    <button onclick="setStatusFilter('Done')" id="btn-status-done" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200">
                        <span>Completed</span> <span id="count-done-badge" class="bg-zinc-800 px-2 py-0.5 rounded text-xs">0</span>
                    </button>
                    <button onclick="setStatusFilter('Todo')" id="btn-status-todo" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200">
                        <span>To Do</span> <span id="count-todo-badge" class="bg-zinc-800 px-2 py-0.5 rounded text-xs">0</span>
                    </button>
                </div>
            </div>

        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#09090b] relative">
        <!-- Close sidebar overlay -->
        <div id="sidebar-overlay" onclick="document.getElementById('sidebar').classList.add('-translate-x-full')" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

        <!-- Top Toolbar -->
        <div class="flex-shrink-0 border-b border-zinc-800 bg-zinc-950/50 backdrop-blur-md z-10 p-4 md:px-8 md:py-6">
            <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
                
                <!-- Search -->
                <div class="relative w-full sm:max-w-md">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></i>
                    <input type="text" id="searchInput" placeholder="Search problems, tags..." 
                        class="w-full pl-9 pr-12 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-1">
                        <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono text-zinc-500 bg-zinc-800 border border-zinc-700 rounded shadow-sm">/</kbd>
                    </div>
                </div>

                <!-- Sort & Actions -->
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <select id="sortSelect" onchange="handleSortChange(event)" class="form-input py-2.5 bg-zinc-900 border-zinc-800 text-sm cursor-pointer hover:border-zinc-700">
                        <option value="default">Default Sort</option>
                        <option value="diffAsc">Difficulty: Easy to Hard</option>
                        <option value="diffDesc">Difficulty: Hard to Easy</option>
                        <option value="titleAsc">Title: A to Z</option>
                    </select>
                    <button onclick="resetAllFilters()" class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 transition flex-shrink-0" title="Clear Filters">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Tags Filter Chips -->
            <div class="mt-4 flex items-center gap-2 overflow-x-auto no-scrollbar pb-1" id="tags-container">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Problem List Scrollable Area -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar scroll-smooth" id="main-scroll-area">
            <div id="problemList" class="max-w-5xl mx-auto space-y-6 pb-20">
                <!-- Items injected by JS -->
            </div>
        </div>
    </main>

    <!-- Application Logic -->
    <script>
        // Fallback Data
        const fallbackData = [
            { "id": 11, "title": "Container With Most Water", "difficulty": "Easy", "tags": ["Array", "Greedy", "Two Pointers"], "platform": "LeetCode", "platformUrl": "https://leetcode.com/problems/container-with-most-water/description/", "solutions": [{ "name": "Brute Force", "url": "#" }, { "name": "Optimal", "url": "array/container-with-most-water.html" }] },
            { "id": 2751, "title": "Robot Collisions", "difficulty": "Hard", "tags": ["Stack", "Array", "Sorting", "Simulation"], "platform": "LeetCode", "platformUrl": "https://leetcode.com/problems/robot-collisions/description/", "solutions": [{ "name": "Optimal", "url": "array/robot-collisions.html" }] },
            { "id": "15", "title": "3Sum", "difficulty": "Medium", "tags": ["Array", "Two Pointers", "Sorting"], "platform": "LeetCode", "platformUrl": "https://leetcode.com/problems/3sum/description/", "solutions": [{ "name": "Optimal", "url": "algorithm/3sum.html" }] },
            { "id": "70", "title": "Climbing Stairs", "difficulty": "Easy", "tags": ["Dynamic Programming", "Math", "Memoization"], "platform": "LeetCode", "platformUrl": "https://leetcode.com/problems/climbing-stairs/description/", "solutions": [{ "name": "Optimal", "url": "dynamic-programming/climbing-stairs.html" }] }
        ];

        // State Management
        let problemData = [];
        let completedProblems = JSON.parse(localStorage.getItem('dsaTrackerCompleted') || '[]');
        let globalUniqueTags = [];
        let globalUniquePlatforms = [];
        
        // Active Filters
        let state = {
            search: '',
            difficulty: 'All', // All, Easy, Medium, Hard
            tag: 'All',        // All or specific tag
            status: 'All',     // All, Done, Todo
            sort: 'default'
        };

        // DOM Elements
        const listContainer = document.getElementById('problemList');
        const searchInput = document.getElementById('searchInput');

        // Helpers
        function getDifficultyColor(difficulty) {
            switch (difficulty) {
                case 'Easy': return 'text-emerald-400 bg-emerald-400/10 border-emerald-500/20';
                case 'Medium': return 'text-amber-400 bg-amber-400/10 border-amber-500/20';
                case 'Hard': return 'text-rose-400 bg-rose-400/10 border-rose-500/20';
                default: return 'text-zinc-400 bg-zinc-400/10 border-zinc-500/20';
            }
        }

        function getPlatformConfig(platform) {
            const p = (platform || '').toLowerCase();
            if (p.includes('leetcode')) return { icon: 'code', text: 'LeetCode', color: 'text-amber-500' };
            if (p.includes('geeks') || p.includes('gfg')) return { icon: 'book-open', text: 'GFG', color: 'text-emerald-500' };
            if (p.includes('codeforces')) return { icon: 'bar-chart-2', text: 'Codeforces', color: 'text-rose-500' };
            return { icon: 'external-link', text: platform || 'Link', color: 'text-zinc-400' };
        }

        function getPrimaryCategory(problem) {
            if (problem.tags && problem.tags.length > 0) {
                return problem.tags[0]; // Intelligent grouping based on primary tag
            }
            return "Uncategorized";
        }

        // Initialize & Process Data
        async function initApp() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                problemData = await response.json();
            } catch (error) {
                console.warn("Could not fetch data.json. Using fallback data.", error);
                problemData = fallbackData;
            }

            extractMetadata();
            updateDashboard();

            // Keyboard shortcut for search
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput && document.activeElement.tagName !== 'INPUT') {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        }

        function extractMetadata() {
            const allTags = new Set();
            const allPlatforms = new Set();
            problemData.forEach(p => {
                (p.tags || []).forEach(tag => allTags.add(tag));
                if (p.platform) allPlatforms.add(p.platform);
            });
            globalUniqueTags = Array.from(allTags).sort();
            globalUniquePlatforms = Array.from(allPlatforms).sort();
        }

        // Update UI functions
        function updateDashboard() {
            updateStats();
            renderTagChips();
            renderProblems();
        }

        function updateStats() {
            const counts = { Easy: 0, Medium: 0, Hard: 0, Done: 0, Todo: 0 };
            
            problemData.forEach(p => { 
                if (counts[p.difficulty] !== undefined) counts[p.difficulty]++; 
                if (completedProblems.includes(String(p.id))) counts.Done++;
                else counts.Todo++;
            });

            document.getElementById('stat-total').innerText = problemData.length;
            document.getElementById('stat-easy').innerText = counts.Easy;
            document.getElementById('stat-medium').innerText = counts.Medium;
            document.getElementById('stat-hard').innerText = counts.Hard;

            document.getElementById('count-all-badge').innerText = problemData.length;
            document.getElementById('count-done-badge').innerText = counts.Done;
            document.getElementById('count-todo-badge').innerText = counts.Todo;

            // Circular Progress
            const percentage = problemData.length === 0 ? 0 : Math.round((counts.Done / problemData.length) * 100);
            document.getElementById('progress-percent').innerText = `${percentage}%`;
            document.getElementById('progress-circle').setAttribute('stroke-dasharray', `${percentage}, 100`);
        }

        function renderTagChips() {
            const container = document.getElementById('tags-container');
            let html = `
                <button onclick="setTagFilter('All')" class="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border transition-all ${state.tag === 'All' ? 'bg-indigo-500/20 text-indigo-300 border-indigo-500/50' : 'bg-zinc-900 text-zinc-400 border-zinc-800 active:border-zinc-600'}">
                    All Tags
                </button>
            `;
            globalUniqueTags.forEach(tag => {
                const isActive = state.tag === tag;
                html += `
                    <button onclick="setTagFilter('${tag}')" class="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border transition-all ${isActive ? 'bg-indigo-500/20 text-indigo-300 border-indigo-500/50' : 'bg-zinc-900 text-zinc-400 border-zinc-800 active:border-zinc-600'}">
                        ${tag}
                    </button>
                `;
            });
            container.innerHTML = html;
        }

        // Action Handlers
        searchInput.addEventListener('input', (e) => { state.search = e.target.value; renderProblems(); });
        
        function setDiffFilter(diff) { state.difficulty = diff; updateDashboard(); }
        function setTagFilter(tag) { state.tag = tag; renderTagChips(); renderProblems(); }
        
        function setStatusFilter(status) {
            state.status = status;
            // Update UI active state
            ['all', 'done', 'todo'].forEach(s => {
                const btn = document.getElementById(`btn-status-${s}`);
                if (s.toLowerCase() === status.toLowerCase()) {
                    btn.classList.replace('bg-transparent', 'bg-zinc-800');
                    btn.classList.replace('text-zinc-400', 'text-white');
                    btn.classList.add('bg-zinc-800', 'text-white', 'font-medium');
                } else {
                    btn.classList.remove('bg-zinc-800', 'text-white', 'font-medium');
                    btn.classList.add('text-zinc-400');
                }
            });
            renderProblems();
        }

        function handleSortChange(e) { state.sort = e.target.value; renderProblems(); }
        
        function resetAllFilters() {
            state = { search: '', difficulty: 'All', tag: 'All', status: 'All', sort: 'default' };
            searchInput.value = '';
            document.getElementById('sortSelect').value = 'default';
            setStatusFilter('All');
            updateDashboard();
        }

        function toggleProblemStatus(id) {
            const strId = String(id);
            if (completedProblems.includes(strId)) {
                completedProblems = completedProblems.filter(i => i !== strId);
            } else {
                completedProblems.push(strId);
            }
            localStorage.setItem('dsaTrackerCompleted', JSON.stringify(completedProblems));
            updateStats();
            // Optional: If filtered by Done/Todo, re-render to hide/show dynamically
            if(state.status !== 'All') renderProblems(); 
        }

        function resetProgress() {
            if (confirm("Are you sure you want to reset all your solved problems? This cannot be undone.")) {
                completedProblems = [];
                localStorage.removeItem('dsaTrackerCompleted');
                updateDashboard();
            }
        }

        // Function to reset progress for a specific category
        function resetCategoryProgress(categoryEncoded) {
            const categoryName = decodeURIComponent(categoryEncoded);
            if (confirm(`Are you sure you want to reset your progress for the entire "${categoryName}" category?`)) {
                // Find all problem IDs that belong to this category
                const problemsInCategory = problemData.filter(p => getPrimaryCategory(p) === categoryName);
                const problemIdsToReset = problemsInCategory.map(p => String(p.id));

                // Filter them out of the completed storage
                completedProblems = completedProblems.filter(id => !problemIdsToReset.includes(id));
                localStorage.setItem('dsaTrackerCompleted', JSON.stringify(completedProblems));
                
                // Refresh UI
                updateDashboard();
            }
        }

        function toggleCategory(categoryId) {
            const content = document.getElementById(`category-${categoryId}`);
            const icon = document.getElementById(`icon-${categoryId}`);
            content.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }

        // Sorting & Filtering Logic
        function getFilteredAndSortedData() {
            let filtered = problemData.filter(p => {
                const searchStr = `${p.id} ${p.title} ${p.tags.join(' ')} ${p.platform}`.toLowerCase();
                const matchesSearch = searchStr.includes(state.search.toLowerCase());
                const matchesDiff = state.difficulty === 'All' || p.difficulty === state.difficulty;
                const matchesTag = state.tag === 'All' || (p.tags || []).includes(state.tag);
                
                const isDone = completedProblems.includes(String(p.id));
                const matchesStatus = state.status === 'All' || (state.status === 'Done' && isDone) || (state.status === 'Todo' && !isDone);
                
                return matchesSearch && matchesDiff && matchesTag && matchesStatus;
            });

            const diffVal = { 'Easy': 1, 'Medium': 2, 'Hard': 3 };
            filtered.sort((a, b) => {
                if (state.sort === 'titleAsc') return a.title.localeCompare(b.title);
                if (state.sort === 'diffAsc') return (diffVal[a.difficulty] || 0) - (diffVal[b.difficulty] || 0);
                if (state.sort === 'diffDesc') return (diffVal[b.difficulty] || 0) - (diffVal[a.difficulty] || 0);
                // Default: By ID roughly
                const numA = parseInt(String(a.id).match(/\d+/)?.[0] || '9999');
                const numB = parseInt(String(b.id).match(/\d+/)?.[0] || '9999');
                return numA - numB;
            });

            return filtered;
        }

        // Main Render
        function renderProblems() {
            const data = getFilteredAndSortedData();

            if (data.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-20 px-4">
                        <div class="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center mx-auto mb-4 text-zinc-600">
                            <i data-lucide="search-x" class="w-8 h-8"></i>
                        </div>
                        <h3 class="text-lg font-medium text-white mb-1">No problems found</h3>
                        <p class="text-zinc-400 text-sm">Try adjusting your filters or search query.</p>
                        <button onclick="resetAllFilters()" class="mt-4 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-sm transition-colors text-white">Clear Filters</button>
                    </div>`;
                lucide.createIcons();
                return;
            }

            // Group by Primary Tag
            const grouped = {};
            data.forEach(p => {
                const cat = getPrimaryCategory(p);
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(p);
            });

            const sortedCategories = Object.keys(grouped).sort();
            let html = '';

            sortedCategories.forEach(category => {
                const categoryId = category.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
                const problems = grouped[category];
                const encodedCategory = encodeURIComponent(category);
                
                // Render custom category header with the embedded Reset Button
                html += `
                    <div class="mb-6 animate-fade-in">
                        <div class="w-full flex items-center justify-between py-2 group">
                            <button onclick="toggleCategory('${categoryId}')" class="flex items-center gap-3 text-left focus:outline-none flex-shrink-0">
                                <i data-lucide="folder" class="w-4 h-4 text-zinc-500 group-hover:text-indigo-400 transition-colors"></i>
                                <span class="text-sm font-bold tracking-wider uppercase text-zinc-300 group-hover:text-white transition-colors">${category}</span>
                                <span class="text-[10px] font-mono text-zinc-500 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800">${problems.length}</span>
                            </button>
                            
                            <div class="flex-1 h-px bg-zinc-800 mx-4"></div>
                            
                            <div class="flex items-center gap-1 flex-shrink-0">
                                <button onclick="resetCategoryProgress('${encodedCategory}')" class="p-1.5 text-zinc-500 hover:text-rose-400 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-all rounded hover:bg-zinc-800 focus:outline-none" title="Reset this Category">
                                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                                </button>
                                <button onclick="toggleCategory('${categoryId}')" class="p-1.5 text-zinc-500 hover:text-white transition-colors focus:outline-none">
                                    <i data-lucide="chevron-down" id="icon-${categoryId}" class="w-4 h-4 transition-transform"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div id="category-${categoryId}" class="mt-3 grid gap-2">
                `;

                problems.forEach(p => {
                    const isDone = completedProblems.includes(String(p.id));
                    const diffClass = getDifficultyColor(p.difficulty);
                    const platformCfg = getPlatformConfig(p.platform);
                    const solutions = p.solutions || [];

                    html += `
                        <div class="group relative flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-zinc-900/40 hover:bg-zinc-900 border border-zinc-800/60 hover:border-zinc-700 rounded-xl transition-all gap-4">
                            
                            <!-- Left: Status & Title -->
                            <div class="flex items-start sm:items-center gap-3 sm:gap-4 flex-1 min-w-0">
                                <div class="pt-0.5 sm:pt-0">
                                    <input type="checkbox" class="custom-checkbox" ${isDone ? 'checked' : ''} onchange="toggleProblemStatus('${p.id}')" title="Mark as done">
                                </div>
                                <div class="flex flex-col gap-1 min-w-0">
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs font-mono text-zinc-500">#${p.id}</span>
                                        <h3 class="text-sm sm:text-base font-semibold text-zinc-200 truncate group-hover:text-white" title="${p.title}">
                                            ${p.title}
                                        </h3>
                                    </div>
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="px-1.5 py-0.5 rounded text-[10px] uppercase font-bold border ${diffClass}">
                                            ${p.difficulty}
                                        </span>
                                        <span class="flex items-center gap-1 text-[11px] text-zinc-400">
                                            <i data-lucide="${platformCfg.icon}" class="w-3 h-3 ${platformCfg.color}"></i> ${platformCfg.text}
                                        </span>
                                        <div class="hidden sm:flex items-center gap-1.5 border-l border-zinc-800 pl-2 ml-1">
                                            ${(p.tags || []).slice(1, 3).map(t => `<span class="text-[10px] text-zinc-500 bg-zinc-950 px-1.5 py-0.5 rounded">${t}</span>`).join('')}
                                            ${(p.tags || []).length > 3 ? `<span class="text-[10px] text-zinc-600">...</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Right: Actions -->
                            <div class="flex items-center gap-2 sm:opacity-70 sm:group-hover:opacity-100 transition-opacity pl-8 sm:pl-0">
                                <a href="${p.platformUrl || '#'}" target="_blank" class="p-2 bg-zinc-950 border border-zinc-800 hover:border-zinc-600 rounded-lg text-zinc-400 hover:text-white transition-colors shadow-sm" title="Open on ${platformCfg.text}">
                                    <i data-lucide="external-link" class="w-4 h-4"></i>
                                </a>
                                ${solutions.map(sol => `
                                    <a href="${sol.url}" target="_blank" class="flex items-center gap-1.5 px-3 py-2 bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/20 hover:border-indigo-500/40 rounded-lg text-indigo-300 text-xs font-medium transition-colors shadow-sm whitespace-nowrap">
                                        <i data-lucide="play-circle" class="w-3.5 h-3.5"></i> ${sol.name}
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            listContainer.innerHTML = html;
            lucide.createIcons();
        }

        // Boot
        initApp();

    </script>
</body>
</html>
