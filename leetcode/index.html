<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo Flows</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Canvas Confetti for Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        zinc: {
                            850: '#202024',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    },
                    animation: {
                        'slide-in-right': 'slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards',
                        'fade-in': 'fadeIn 0.2s ease-out forwards',
                    },
                    keyframes: {
                        slideInRight: {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
        }

        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25em;
            height: 1.25em;
            border: 2px solid #52525b;
            border-radius: 0.35em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            background-color: #09090b;
            transition: 120ms transform ease-in-out;
        }
        .custom-checkbox:checked {
            background-color: #10b981; 
            border-color: #10b981;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* Circular Progress */
        .circular-chart { display: block; margin: 0 auto; max-width: 80%; max-height: 250px; }
        .circle-bg { fill: none; stroke: #27272a; stroke-width: 3.8; }
        .circle { 
            fill: none; 
            stroke-width: 2.8; 
            stroke-linecap: round; 
            transition: stroke-dasharray 1s ease-out;
        }
        
        .form-input {
            width: 100%;
            background: #18181b;
            border: 1px solid #3f3f46;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            color: #f4f4f5;
            transition: all 0.2s;
            font-size: 0.875rem;
        }
        .form-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
    </style>
</head>

<body class="h-screen w-full antialiased flex flex-col md:flex-row overflow-hidden selection:bg-indigo-500/30 relative">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2"></div>

    <!-- Floating Timer -->
    <div id="floating-timer" class="fixed bottom-4 right-4 z-[50] bg-zinc-900 border border-zinc-800 rounded-2xl shadow-xl p-2.5 flex items-center gap-3 transition-transform hover:-translate-y-1">
        <div class="flex items-center justify-center w-8 h-8 rounded-full bg-indigo-500/10 text-indigo-400 shrink-0">
            <i data-lucide="timer" class="w-4 h-4"></i>
        </div>
        
        <div class="flex flex-col relative">
            <button onclick="toggleTimerMenu()" id="timer-mode-btn" class="flex items-center gap-1 bg-transparent text-[10px] uppercase font-bold tracking-wider text-zinc-500 focus:outline-none cursor-pointer hover:text-zinc-300 transition-colors -mb-1 w-max">
                <span id="timer-mode-label">Stopwatch</span>
                <i data-lucide="chevron-up" class="w-3 h-3"></i>
            </button>
            
            <div id="timer-menu" class="absolute bottom-full left-0 mb-2 w-44 bg-zinc-900 border border-zinc-700 rounded-xl shadow-2xl overflow-hidden hidden flex-col z-[70] py-1.5 origin-bottom animate-fade-in">
                <button onclick="setTimerMode('stopwatch', 'Stopwatch')" class="text-left px-3 py-2 text-xs font-medium text-zinc-300 hover:bg-zinc-800 hover:text-white transition-colors">Stopwatch</button>
                <button onclick="setTimerMode('pomodoro', 'Pomodoro (25m)')" class="text-left px-3 py-2 text-xs font-medium text-zinc-300 hover:bg-zinc-800 hover:text-white transition-colors">Pomodoro (25m)</button>
                <button onclick="setTimerMode('break', 'Short Break (5m)')" class="text-left px-3 py-2 text-xs font-medium text-zinc-300 hover:bg-zinc-800 hover:text-white transition-colors">Short Break (5m)</button>
            </div>

            <span id="timer-display" class="font-mono text-lg font-bold text-zinc-100 tracking-wider w-[85px] text-left">00:00:00</span>
        </div>

        <div class="flex items-center gap-1 border-l border-zinc-800 pl-3">
            <button onclick="toggleTimer()" id="timer-toggle-btn" class="p-1.5 rounded-lg text-zinc-400 hover:text-indigo-400 hover:bg-zinc-800 transition" title="Start/Pause Timer">
                <i data-lucide="play" id="timer-icon" class="w-4 h-4"></i>
            </button>
            <button onclick="resetTimer()" class="p-1.5 rounded-lg text-zinc-400 hover:text-rose-400 hover:bg-zinc-800 transition" title="Reset Timer">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- Notes Modal -->
    <div id="notes-modal" class="fixed inset-0 bg-black/70 z-[70] hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-2xl max-w-lg w-full mx-4 transform scale-95 transition-transform duration-200 flex flex-col h-[60vh] max-h-[500px]" id="notes-modal-content">
            <div class="flex items-center justify-between mb-4 flex-shrink-0">
                <div class="flex items-center gap-2">
                    <i data-lucide="sticky-note" class="w-5 h-5 text-indigo-400"></i>
                    <h3 class="text-lg font-bold text-white truncate pr-4" id="notes-title">Problem Notes</h3>
                </div>
                <button onclick="closeNotes()" class="text-zinc-500 hover:text-white transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <textarea id="notes-textarea" class="w-full flex-1 bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-zinc-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none transition-all" placeholder="Write your approach, edge cases, or optimizations here..."></textarea>
            <div class="flex justify-end gap-3 mt-4 flex-shrink-0">
                <button onclick="closeNotes()" class="px-4 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-800 transition">Cancel</button>
                <button onclick="saveNotes()" class="px-5 py-2 rounded-lg text-sm font-medium bg-indigo-500 text-white hover:bg-indigo-600 transition shadow-lg shadow-indigo-500/20 flex items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Save Notes
                </button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/60 z-[70] hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl shadow-2xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-200" id="confirm-modal-content">
            <h3 class="text-lg font-bold text-white mb-2" id="confirm-title">Confirm Action</h3>
            <p class="text-zinc-400 text-sm mb-6" id="confirm-desc">Are you sure?</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeConfirm()" class="px-4 py-2 rounded-lg text-sm font-medium text-zinc-300 hover:text-white hover:bg-zinc-800 transition">Cancel</button>
                <button id="confirm-btn" class="px-4 py-2 rounded-lg text-sm font-medium bg-rose-500 text-white hover:bg-rose-600 transition shadow-lg shadow-rose-500/20">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Mobile Header -->
    <header class="md:hidden flex items-center justify-between p-4 border-b border-zinc-800 bg-zinc-950/80 backdrop-blur z-20 flex-shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center border border-indigo-500/30 text-indigo-400">
                <i data-lucide="terminal" class="w-4 h-4"></i>
            </div>
            <h1 class="font-bold text-lg tracking-tight">Algo<span class="text-indigo-400">Flows</span></h1>
        </div>
        <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" class="p-2 text-zinc-400 hover:text-white bg-zinc-900 rounded-lg border border-zinc-800">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- Sidebar / Stats Panel -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-zinc-950 border-r border-zinc-800 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col h-full max-h-screen">
        <div class="p-6 hidden md:flex items-center gap-3 flex-shrink-0">
            <div class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center border border-indigo-500/20 text-indigo-400 shadow-inner">
                <i data-lucide="code-2" class="w-5 h-5"></i>
            </div>
            <h1 class="font-extrabold text-xl tracking-tight">Algo<span class="text-indigo-400">Flows</span></h1>
        </div>

        <div class="flex-1 overflow-y-auto p-6 pt-0 md:pt-2 space-y-8 custom-scrollbar pb-36">
            
            <!-- Progress Section -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Your Progress</h2>
                    <div class="flex items-center gap-1">
                        <input type="file" id="import-file" class="hidden" accept=".json" onchange="importProgress(event)">
                        
                        <button onclick="triggerImport()" class="text-zinc-500 hover:text-indigo-400 transition-colors bg-zinc-900/50 hover:bg-indigo-500/10 p-1.5 rounded-md border border-zinc-800/50 hover:border-indigo-500/30" title="Import JSON Progress">
                            <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="exportProgress()" class="text-zinc-500 hover:text-emerald-400 transition-colors bg-zinc-900/50 hover:bg-emerald-500/10 p-1.5 rounded-md border border-zinc-800/50 hover:border-emerald-500/30" title="Export JSON Data">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="resetProgress()" class="text-zinc-500 hover:text-rose-400 transition-colors bg-zinc-900/50 hover:bg-rose-500/10 p-1.5 rounded-md border border-zinc-800/50 hover:border-rose-500/30" title="Reset All Progress">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>

                <div class="relative flex items-center justify-center bg-zinc-900/50 rounded-2xl p-4 border border-zinc-800/50">
                    <svg viewBox="0 0 36 36" class="circular-chart w-32 h-32">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle stroke-indigo-500" stroke-dasharray="0, 100" id="progress-circle" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div class="absolute flex flex-col items-center justify-center">
                        <span class="text-2xl font-bold text-white" id="progress-percent">0%</span>
                        <span class="text-[10px] text-zinc-400 font-medium">Completed</span>
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div>
                <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-4">Difficulty Stats</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-zinc-900 rounded-xl p-3 border border-zinc-800 flex flex-col justify-center cursor-pointer hover:border-zinc-700 transition" onclick="setDiffFilter('All')">
                        <span class="text-xl font-bold text-white" id="stat-total">0</span>
                        <span class="text-[11px] text-zinc-400 uppercase tracking-wider font-semibold">Total Problems</span>
                    </div>
                    
                    <!-- Easy Progress Card -->
                    <div class="bg-emerald-500/5 rounded-xl p-3 border border-emerald-500/10 cursor-pointer hover:border-emerald-500/30 transition relative overflow-hidden group" onclick="setDiffFilter('Easy')">
                        <div class="absolute bottom-0 left-0 h-1 bg-emerald-500/10 w-full"></div>
                        <div class="absolute bottom-0 left-0 h-1 bg-emerald-500 transition-all duration-500" id="pb-easy" style="width: 0%"></div>
                        <div class="flex flex-col relative z-10">
                            <span class="text-xl font-bold text-emerald-400 flex items-baseline gap-1">
                                <span id="stat-easy-done">0</span>
                                <span class="text-xs text-emerald-500/50 font-medium">/ <span id="stat-easy">0</span></span>
                            </span>
                            <span class="text-[11px] text-emerald-500/70 uppercase tracking-wider font-semibold">Easy</span>
                        </div>
                    </div>

                    <!-- Medium Progress Card -->
                    <div class="bg-amber-500/5 rounded-xl p-3 border border-amber-500/10 cursor-pointer hover:border-amber-500/30 transition relative overflow-hidden group" onclick="setDiffFilter('Medium')">
                        <div class="absolute bottom-0 left-0 h-1 bg-amber-500/10 w-full"></div>
                        <div class="absolute bottom-0 left-0 h-1 bg-amber-500 transition-all duration-500" id="pb-medium" style="width: 0%"></div>
                        <div class="flex flex-col relative z-10">
                            <span class="text-xl font-bold text-amber-400 flex items-baseline gap-1">
                                <span id="stat-medium-done">0</span>
                                <span class="text-xs text-amber-500/50 font-medium">/ <span id="stat-medium">0</span></span>
                            </span>
                            <span class="text-[11px] text-amber-500/70 uppercase tracking-wider font-semibold">Medium</span>
                        </div>
                    </div>

                    <!-- Hard Progress Card -->
                    <div class="bg-rose-500/5 rounded-xl p-3 border border-rose-500/10 cursor-pointer hover:border-rose-500/30 transition relative overflow-hidden group" onclick="setDiffFilter('Hard')">
                        <div class="absolute bottom-0 left-0 h-1 bg-rose-500/10 w-full"></div>
                        <div class="absolute bottom-0 left-0 h-1 bg-rose-500 transition-all duration-500" id="pb-hard" style="width: 0%"></div>
                        <div class="flex flex-col relative z-10">
                            <span class="text-xl font-bold text-rose-400 flex items-baseline gap-1">
                                <span id="stat-hard-done">0</span>
                                <span class="text-xs text-rose-500/50 font-medium">/ <span id="stat-hard">0</span></span>
                            </span>
                            <span class="text-[11px] text-rose-500/70 uppercase tracking-wider font-semibold">Hard</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Primary Filters Sidebar -->
            <div>
                <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-4">Library</h2>
                <div class="flex flex-col gap-2">
                    <button onclick="setStatusFilter('All')" id="btn-status-all" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors bg-zinc-800 text-white font-medium">
                        <span class="flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4"></i> All Problems</span> 
                        <span id="count-all-badge" class="bg-zinc-700 px-2 py-0.5 rounded text-xs">0</span>
                    </button>
                    <button onclick="setStatusFilter('Done')" id="btn-status-done" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200">
                        <span class="flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-emerald-500/70"></i> Completed</span> 
                        <span id="count-done-badge" class="bg-zinc-800 px-2 py-0.5 rounded text-xs">0</span>
                    </button>
                    <button onclick="setStatusFilter('Todo')" id="btn-status-todo" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200">
                        <span class="flex items-center gap-2"><i data-lucide="circle-dashed" class="w-4 h-4"></i> To Do</span> 
                        <span id="count-todo-badge" class="bg-zinc-800 px-2 py-0.5 rounded text-xs">0</span>
                    </button>
                    
                    <div class="border-t border-zinc-800/50 my-1 pt-2"></div>
                    
                    <button onclick="setStatusFilter('Favorites')" id="btn-status-favorites" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200">
                        <span class="flex items-center gap-2 text-amber-500/80"><i data-lucide="star" class="w-4 h-4"></i> Favorites</span> 
                        <span id="count-fav-badge" class="bg-zinc-800 px-2 py-0.5 rounded text-xs">0</span>
                    </button>
                </div>
            </div>

        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#09090b] relative">
        <div id="sidebar-overlay" onclick="document.getElementById('sidebar').classList.add('-translate-x-full')" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

        <!-- Top Toolbar - Fixed flex layout to ensure Random/Sort/Reset never hide -->
        <div class="top-toolbar flex-shrink-0 border-b border-zinc-800 bg-zinc-950/50 backdrop-blur-md z-10 p-4 md:px-8 md:py-6">
            <div class="flex flex-col xl:flex-row gap-4 items-start xl:items-center justify-between">
                
                <!-- Search -->
                <div class="relative w-full xl:max-w-md">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></i>
                    <input type="text" id="searchInput" placeholder="Search problems, tags..." 
                        class="w-full pl-9 pr-12 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all shadow-sm">
                </div>

                <!-- Sort & Actions (Wrapped securely) -->
                <div class="flex flex-wrap items-center gap-2 w-full xl:w-auto">
                    
                    <select id="platformSelect" onchange="handlePlatformChange(event)" class="form-input py-2.5 bg-zinc-900 border-zinc-800 text-sm cursor-pointer hover:border-zinc-700 min-w-[130px] w-auto shrink-0 shadow-sm">
                        <option value="All">All Platforms</option>
                        <!-- Injected by JS -->
                    </select>

                    <select id="sortSelect" onchange="handleSortChange(event)" class="form-input py-2.5 bg-zinc-900 border-zinc-800 text-sm cursor-pointer hover:border-zinc-700 min-w-[140px] w-auto shrink-0 shadow-sm">
                        <option value="default">Default Sort</option>
                        <option value="diffAsc">Diff: Easy -> Hard</option>
                        <option value="diffDesc">Diff: Hard -> Easy</option>
                        <option value="titleAsc">Title: A to Z</option>
                    </select>
                    
                    <button onclick="pickRandom()" class="p-2.5 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 hover:text-indigo-300 hover:bg-indigo-500/20 hover:border-indigo-500/40 transition flex-shrink-0 shadow-sm" title="Pick Random Unsolved Problem">
                        <i data-lucide="dices" class="w-4 h-4"></i>
                    </button>

                    <button onclick="resetAllFilters()" class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 transition flex-shrink-0 shadow-sm" title="Clear Filters">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Tags Filter Chips -->
            <div class="mt-4 flex items-start gap-2 relative w-full">
                <div id="tags-container" class="flex flex-wrap gap-2 overflow-hidden transition-all duration-300 max-h-[32px] flex-1">
                    <!-- Injected via JS -->
                </div>
                <button onclick="toggleTagsExpand()" id="expand-tags-btn" class="hidden flex-shrink-0 px-2 py-1.5 rounded-lg text-xs font-medium border bg-zinc-900 text-zinc-400 border-zinc-800 hover:border-zinc-600 transition-all items-center justify-center h-[32px] z-10" title="Show more tags">
                    <i data-lucide="chevron-down" id="expand-tags-icon" class="w-4 h-4 transition-transform duration-300"></i>
                </button>
            </div>
        </div>

        <!-- Problem List Scrollable Area -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar scroll-smooth" id="main-scroll-area">
            <div id="problemList" class="max-w-5xl mx-auto pb-32">
                <!-- Items injected by JS -->
            </div>
        </div>
    </main>

    <!-- Application Logic -->
    <script>
        // Core State Management
        let problemData = [];
        let completedProblems = JSON.parse(localStorage.getItem('dsaTrackerCompleted') || '[]');
        let favoriteProblems = JSON.parse(localStorage.getItem('dsaTrackerFavorites') || '[]');
        let problemNotes = JSON.parse(localStorage.getItem('dsaTrackerNotes') || '{}');

        let globalUniqueTags = [];
        let globalUniquePlatforms = [];
        let isTagsExpanded = false;
        let activeNoteId = null; 

        // Timer State
        let currentTimerMode = 'stopwatch';
        let timerInterval = null;
        let timerSeconds = 0;
        let timerDirection = 1;
        let timerIsRunning = false;
        
        // Active Filters
        let state = {
            search: '',
            difficulty: 'All', 
            selectedTags: [],  
            platform: 'All',
            status: 'All',     // All, Done, Todo, Favorites
            sort: 'default'
        };

        // DOM Elements
        const listContainer = document.getElementById('problemList');
        const searchInput = document.getElementById('searchInput');

        // --- Custom Notifications & Modals ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-rose-500/20 border-rose-500/50 text-rose-200' : 'bg-emerald-500/20 border-emerald-500/50 text-emerald-200';
            const icon = type === 'error' ? 'alert-circle' : 'check-circle';
            
            toast.className = `px-4 py-3 rounded-lg border backdrop-blur-md shadow-lg transition-all duration-300 transform translate-y-10 opacity-0 flex items-center gap-2 text-sm font-medium ${bg}`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i> ${message}`;

        // --- Timer Logic ---
        function formatTime(sec) {
            const h = Math.floor(sec / 3600).toString().padStart(2, '0');
            const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function toggleTimerMenu() {
            const menu = document.getElementById('timer-menu');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
            }
        }

        function setTimerMode(mode, label) {
            currentTimerMode = mode;
            document.getElementById('timer-mode-label').innerText = label;
            toggleTimerMenu();
            resetTimer();
        }

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('timer-menu');
            const btn = document.getElementById('timer-mode-btn');
            if (menu && btn && !menu.classList.contains('hidden') && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
            }
        });

        function toggleTimer() {
            const icon = document.getElementById('timer-icon');
            const btn = document.getElementById('timer-toggle-btn');
            
            if (timerIsRunning) {
                clearInterval(timerInterval);
                timerIsRunning = false;
                icon.setAttribute('data-lucide', 'play');
                btn.classList.replace('text-indigo-400', 'text-zinc-400');
                btn.classList.replace('bg-indigo-500/10', 'hover:bg-zinc-800');
            } else {
                if (timerDirection === -1 && timerSeconds <= 0) resetTimer();

                timerInterval = setInterval(() => {
                    timerSeconds += timerDirection;
                    
                    if (timerDirection === -1 && timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        timerIsRunning = false;
                        icon.setAttribute('data-lucide', 'play');
                        btn.classList.replace('text-indigo-400', 'text-zinc-400');
                        btn.classList.replace('bg-indigo-500/10', 'hover:bg-zinc-800');
                        timerSeconds = 0;
                        showToast("Time's up! Session completed.", "success");
                    }

                    document.getElementById('timer-display').innerText = formatTime(timerSeconds);
                }, 1000);
                timerIsRunning = true;
                icon.setAttribute('data-lucide', 'pause');
                btn.classList.replace('text-zinc-400', 'text-indigo-400');
                btn.classList.replace('hover:bg-zinc-800', 'bg-indigo-500/10');
            }
            lucide.createIcons();
        }

        function resetTimer() {
            const mode = currentTimerMode;
            if (mode === 'pomodoro') { timerSeconds = 25 * 60; timerDirection = -1; }
            else if (mode === 'break') { timerSeconds = 5 * 60; timerDirection = -1; } 
            else { timerSeconds = 0; timerDirection = 1; }

            document.getElementById('timer-display').innerText = formatTime(timerSeconds);
            if (timerIsRunning) toggleTimer(); 
        }

        function openNotes(id) {
            activeNoteId = String(id);

            document.getElementById('notes-title').innerText = `Notes: ${prob ? prob.title : 'Problem'}`;

                content.classList.remove('scale-95');

            const content = document.getElementById('notes-modal-content');

            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                activeNoteId = null;
            }, 200);

        function saveNotes() {
            if (!activeNoteId) return;
            const text = document.getElementById('notes-textarea').value.trim();
            if (text) {
                problemNotes[activeNoteId] = text;
            } else {
                delete problemNotes[activeNoteId];
            }

            showToast("Note saved successfully.");

        // --- Favorites Logic ---
        function toggleFavorite(id) {
            const strId = String(id);
            if (favoriteProblems.includes(strId)) {
                favoriteProblems = favoriteProblems.filter(i => i !== strId);
            } else {
                favoriteProblems.push(strId);
                showToast("Added to Favorites", "success");
            }
            localStorage.setItem('dsaTrackerFavorites', JSON.stringify(favoriteProblems));
            updateStats();
            renderProblems(); 
        }

        function toggleProblemStatus(id, event) {
            const strId = String(id);
            const isChecked = event.target.checked;

            if (isChecked) {
                if (!completedProblems.includes(strId)) {
                    completedProblems.push(strId);
                    showToast(`Problem #${id} marked as done!`, 'success');

                    // Confetti!
                    const rect = event.target.getBoundingClientRect();
                    triggerConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
                }
            } else {
                completedProblems = completedProblems.filter(i => i !== strId);
            }
            
            localStorage.setItem('dsaTrackerCompleted', JSON.stringify(completedProblems));
            updateStats();
            
            if(state.status === 'Done' || state.status === 'Todo') renderProblems();

        // Helpers
        function getDifficultyColor(difficulty) {
            switch (difficulty) {
                case 'Easy': return 'text-emerald-400 bg-emerald-400/10 border-emerald-500/20';
                case 'Medium': return 'text-amber-400 bg-amber-400/10 border-amber-500/20';
                case 'Hard': return 'text-rose-400 bg-rose-400/10 border-rose-500/20';
                default: return 'text-zinc-400 bg-zinc-400/10 border-zinc-500/20';
            }
        }

        function getPlatformConfig(platform) {
            const p = (platform || '').toLowerCase();
            if (p.includes('leetcode')) return { icon: 'code', text: 'LeetCode', color: 'text-amber-500' };
            if (p.includes('geeks') || p.includes('gfg')) return { icon: 'book-open', text: 'GFG', color: 'text-emerald-500' };
            if (p.includes('codeforces')) return { icon: 'bar-chart-2', text: 'Codeforces', color: 'text-rose-500' };
            return { icon: 'external-link', text: platform || 'Link', color: 'text-zinc-400' };
        }

        // Initialize & Process Data
        async function initApp() {
            lucide.createIcons();
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                const rawData = await response.json();
                problemData = rawData.map((item, index) => ({ ...item, originalIndex: index }));
            } catch (error) {
                console.warn("Could not fetch data.json. Waiting for data...");
                problemData = [];
            }

            extractMetadata();
            populatePlatformDropdown();
            updateDashboard();

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (activeNoteId) closeNotes();
                    const menu = document.getElementById('timer-menu');
                    if (menu && !menu.classList.contains('hidden')) {
                        menu.classList.add('hidden'); menu.classList.remove('flex');
                    }
                }
            });
        }

        function extractMetadata() {
            const allTags = new Set();
            const allPlatforms = new Set();
            problemData.forEach(p => {
                (p.tags || []).forEach(tag => allTags.add(tag));
                if (p.platform) allPlatforms.add(p.platform);
            });
            globalUniqueTags = Array.from(allTags).sort();
            globalUniquePlatforms = Array.from(allPlatforms).sort();
        }

        function populatePlatformDropdown() {
            const select = document.getElementById('platformSelect');
            select.innerHTML = '<option value="All">All Platforms</option>';
            globalUniquePlatforms.forEach(plat => {
                const opt = document.createElement('option');
                opt.value = plat; opt.textContent = plat;
                select.appendChild(opt);
            });
        }

        // Update UI functions
        function updateDashboard() {
            updateStats();
            renderTagChips();
            renderProblems();
        }

        function updateStats() {
            const counts = { Easy: 0, Medium: 0, Hard: 0, Done: 0, Todo: 0, Fav: favoriteProblems.length };
            const doneCounts = { Easy: 0, Medium: 0, Hard: 0 };
            
            problemData.forEach(p => { 
                if (counts[p.difficulty] !== undefined) counts[p.difficulty]++; 
                if (completedProblems.includes(String(p.id))) {
                    counts.Done++;
                    if (doneCounts[p.difficulty] !== undefined) doneCounts[p.difficulty]++;
                } else {
                    counts.Todo++;
                }
            });

            document.getElementById('stat-total').innerText = problemData.length;
            
            // Total Counts
            document.getElementById('stat-easy').innerText = counts.Easy;
            document.getElementById('stat-medium').innerText = counts.Medium;
            document.getElementById('stat-hard').innerText = counts.Hard;
            
            // Done Counts
            document.getElementById('stat-easy-done').innerText = doneCounts.Easy;
            document.getElementById('stat-medium-done').innerText = doneCounts.Medium;
            document.getElementById('stat-hard-done').innerText = doneCounts.Hard;

            // Progress Bars Calculation
            const pEasy = counts.Easy ? (doneCounts.Easy / counts.Easy * 100) : 0;
            const pMedium = counts.Medium ? (doneCounts.Medium / counts.Medium * 100) : 0;
            const pHard = counts.Hard ? (doneCounts.Hard / counts.Hard * 100) : 0;

            document.getElementById('pb-easy').style.width = `${pEasy}%`;
            document.getElementById('pb-medium').style.width = `${pMedium}%`;
            document.getElementById('pb-hard').style.width = `${pHard}%`;

            // Badges
            document.getElementById('count-all-badge').innerText = problemData.length;
            document.getElementById('count-done-badge').innerText = counts.Done;
            document.getElementById('count-todo-badge').innerText = counts.Todo;
            document.getElementById('count-fav-badge').innerText = counts.Fav;

            // Circular Progress
            const percentage = problemData.length === 0 ? 0 : Math.round((counts.Done / problemData.length) * 100);
            document.getElementById('progress-percent').innerText = `${percentage}%`;
            document.getElementById('progress-circle').setAttribute('stroke-dasharray', `${percentage}, 100`);
        }

        // --- Import/Export Features ---
        function exportProgress() {
            const exportData = {
                completed: completedProblems,
                favorites: favoriteProblems,
                notes: problemNotes
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "algo-flows-backup.json");

            downloadAnchorNode.remove();

        function triggerImport() { document.getElementById('import-file').click(); }
        
        function importProgress(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    
                    if (Array.isArray(imported)) {
                        completedProblems = imported.map(String);
                        localStorage.setItem('dsaTrackerCompleted', JSON.stringify(completedProblems));
                        showToast("Legacy progress imported successfully!", "success");
                    } else if (imported && typeof imported === 'object') {
                        completedProblems = imported.completed || [];
                        favoriteProblems = imported.favorites || [];
                        problemNotes = imported.notes || {};
                        
                        localStorage.setItem('dsaTrackerCompleted', JSON.stringify(completedProblems));
                        localStorage.setItem('dsaTrackerFavorites', JSON.stringify(favoriteProblems));
                        localStorage.setItem('dsaTrackerNotes', JSON.stringify(problemNotes));
                        
                        showToast("Full backup imported successfully!", "success");
                    } else {
                        showToast("Invalid file format.", "error"); return;
                    }
                    updateDashboard();
                } catch (err) {
                    showToast("Error parsing file. Ensure it is a valid JSON.", "error");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        function pickRandom() {
            const data = getFilteredAndSortedData().filter(p => !completedProblems.includes(String(p.id)));
            if (data.length === 0) {
                showToast("No unsolved problems found with current filters!", "error"); return;
            }
            const randomIdx = Math.floor(Math.random() * data.length);
            const selected = data[randomIdx];
            const el = document.getElementById(`prob-${selected.id}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('ring-2', 'ring-indigo-500', 'bg-indigo-500/20');
                setTimeout(() => el.classList.remove('ring-2', 'ring-indigo-500', 'bg-indigo-500/20'), 1500);
                showToast(`Picked: ${selected.title}`, 'success');
            }
        }

        // Sorting & Filtering Logic
        function getFilteredAndSortedData() {
            let filtered = problemData.filter(p => {
                const searchStr = `${p.id} ${p.title} ${(p.tags||[]).join(' ')} ${p.platform}`.toLowerCase();
                const matchesSearch = searchStr.includes(state.search.toLowerCase());
                const matchesDiff = state.difficulty === 'All' || p.difficulty === state.difficulty;
                const matchesTag = state.selectedTags.length === 0 || state.selectedTags.some(t => (p.tags || []).includes(t));
                const matchesPlatform = state.platform === 'All' || p.platform === state.platform;
                
                const isDone = completedProblems.includes(String(p.id));
                const isFav = favoriteProblems.includes(String(p.id));
                
                const matchesStatus = state.status === 'All' || 
                                     (state.status === 'Done' && isDone) || 
                                     (state.status === 'Todo' && !isDone) ||
                                     (state.status === 'Favorites' && isFav);
                
                return matchesSearch && matchesDiff && matchesTag && matchesPlatform && matchesStatus;
            });

            const diffVal = { 'Easy': 1, 'Medium': 2, 'Hard': 3 };
            filtered.sort((a, b) => {
                if (state.sort === 'titleAsc') return a.title.localeCompare(b.title);
                if (state.sort === 'diffAsc') return (diffVal[a.difficulty] || 0) - (diffVal[b.difficulty] || 0);
                if (state.sort === 'diffDesc') return (diffVal[b.difficulty] || 0) - (diffVal[a.difficulty] || 0);
                return a.originalIndex - b.originalIndex;
            });

            return filtered;
        }

                            <button onclick="openNotes('${p.id}')" class="p-2 bg-zinc-950 border ${hasNote ? 'border-indigo-500/50 text-indigo-400' : 'border-zinc-800 text-zinc-400 hover:border-zinc-600 hover:text-white'} rounded-lg transition-colors shadow-sm relative" title="${hasNote ? 'Edit Notes' : 'Add Notes'}">
                                <i data-lucide="sticky-note" class="w-4 h-4 ${hasNote ? 'fill-indigo-500/20' : ''}"></i>
                                ${hasNote ? '<span class="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-indigo-500 ring-2 ring-zinc-900"></span>' : ''}
                            </button>

                            <!-- Platform Link -->
                            <a href="${p.platformUrl || '#'}" target="_blank" class="p-2 bg-zinc-950 border border-zinc-800 hover:border-zinc-600 rounded-lg text-zinc-400 hover:text-white transition-colors shadow-sm" title="Open on ${platformCfg.text}">
                                <i data-lucide="external-link" class="w-4 h-4"></i>
                            </a>
                            
                            <!-- Solutions -->
                            ${solutions.map(sol => `
                                <a href="${sol.url}" target="_blank" class="flex items-center gap-1.5 px-3 py-2 bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/20 hover:border-indigo-500/40 rounded-lg text-indigo-300 text-xs font-medium transition-colors shadow-sm whitespace-nowrap">
                                    <i data-lucide="play-circle" class="w-3.5 h-3.5"></i> ${sol.name}
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            listContainer.innerHTML = html;
            lucide.createIcons();
        }

        // Boot
        initApp();

    </script>
</body>
</html>
