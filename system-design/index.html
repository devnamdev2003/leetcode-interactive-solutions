<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SysDesign Flows</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Canvas Confetti for Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
              mono: ['"JetBrains Mono"', "monospace"],
            },
            colors: {
              zinc: {
                850: "#202024",
                900: "#18181b",
                950: "#09090b",
              },
            },
            animation: {
              "slide-in-right": "slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards",
              "fade-in": "fadeIn 0.2s ease-out forwards",
              "scale-up": "scaleUp 0.2s ease-out forwards",
            },
            keyframes: {
              slideInRight: {
                "0%": { transform: "translateX(100%)" },
                "100%": { transform: "translateX(0)" },
              },
              fadeIn: {
                "0%": { opacity: "0", transform: "translateY(5px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              scaleUp: {
                "0%": { opacity: "0", transform: "scale(0.95)" },
                "100%": { opacity: "1", transform: "scale(1)" },
              }
            },
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #09090b;
        color: #f4f4f5;
      }

      /* Modern Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #52525b; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Custom Checkbox */
      .custom-checkbox {
        appearance: none; background-color: transparent; margin: 0; font: inherit;
        color: currentColor; width: 1.25em; height: 1.25em; border: 2px solid #52525b;
        border-radius: 0.35em; display: grid; place-content: center; cursor: pointer;
        transition: all 0.2s ease;
      }
      .custom-checkbox::before {
        content: ""; width: 0.65em; height: 0.65em;
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        transform: scale(0); background-color: #09090b; transition: 120ms transform ease-in-out;
      }
      .custom-checkbox:checked { background-color: #10b981; border-color: #10b981; }
      .custom-checkbox:checked::before { transform: scale(1); }

      /* Circular Progress */
      .circular-chart { display: block; margin: 0 auto; max-width: 80%; max-height: 250px; }
      .circle-bg { fill: none; stroke: #27272a; stroke-width: 3.8; }
      .circle { fill: none; stroke-width: 2.8; stroke-linecap: round; transition: stroke-dasharray 1s ease-out; }

      .form-input {
        width: 100%; background: #18181b; border: 1px solid #3f3f46; border-radius: 0.5rem;
        padding: 0.5rem 0.75rem; color: #f4f4f5; transition: all 0.2s; font-size: 0.875rem;
      }
      .form-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
    </style>
  </head>

  <body class="h-screen w-full antialiased flex flex-col md:flex-row overflow-hidden selection:bg-indigo-500/30 relative">
    
    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2"></div>

    <!-- Notes Modal -->
    <div id="notes-modal" class="fixed inset-0 bg-black/70 z-[70] hidden items-center justify-center backdrop-blur-sm">
      <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-2xl max-w-lg w-full mx-4 transform scale-95 transition-transform duration-200 flex flex-col h-[60vh] max-h-[500px]" id="notes-modal-content">
        <div class="flex items-center justify-between mb-4 flex-shrink-0">
          <div class="flex items-center gap-2">
            <i data-lucide="sticky-note" class="w-5 h-5 text-indigo-400"></i>
            <h3 class="text-lg font-bold text-white truncate pr-4" id="notes-title">Topic Notes</h3>
          </div>
          <button onclick="closeNotes()" class="text-zinc-500 hover:text-white transition">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <textarea id="notes-textarea" class="w-full flex-1 bg-zinc-950 border border-zinc-800 rounded-xl p-4 text-zinc-200 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none transition-all" placeholder="Write your concepts, diagrams, or architectural patterns here..."></textarea>
        <div class="flex justify-end gap-3 mt-4 flex-shrink-0">
          <button onclick="closeNotes()" class="px-4 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-800 transition">Cancel</button>
          <button onclick="saveNotes()" class="px-5 py-2 rounded-lg text-sm font-medium bg-indigo-500 text-white hover:bg-indigo-600 transition shadow-lg shadow-indigo-500/20 flex items-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i> Save Notes
          </button>
        </div>
      </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/60 z-[70] hidden items-center justify-center backdrop-blur-sm">
      <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl shadow-2xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-200" id="confirm-modal-content">
        <h3 class="text-lg font-bold text-white mb-2" id="confirm-title">Confirm Action</h3>
        <p class="text-zinc-400 text-sm mb-6" id="confirm-desc">Are you sure?</p>
        <div class="flex justify-end gap-3">
          <button onclick="closeConfirm()" class="px-4 py-2 rounded-lg text-sm font-medium text-zinc-300 hover:text-white hover:bg-zinc-800 transition">Cancel</button>
          <button id="confirm-btn" class="px-4 py-2 rounded-lg text-sm font-medium bg-rose-500 text-white hover:bg-rose-600 transition shadow-lg shadow-rose-500/20">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Mobile Header -->
    <header class="md:hidden flex items-center justify-between p-4 border-b border-zinc-800 bg-zinc-950/80 backdrop-blur z-20 flex-shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center border border-indigo-500/30 text-indigo-400">
          <i data-lucide="server" class="w-4 h-4"></i>
        </div>
        <h1 class="font-bold text-lg tracking-tight">SysDesign<span class="text-indigo-400">Flows</span></h1>
      </div>
      <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" class="p-2 text-zinc-400 hover:text-white bg-zinc-900 rounded-lg border border-zinc-800">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
    </header>

    <!-- Sidebar / Stats Panel -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-zinc-950 border-r border-zinc-800 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col h-full max-h-screen">
      <div class="p-6 hidden md:flex items-center gap-3 flex-shrink-0 cursor-pointer hover:opacity-80 transition" onclick="goHome()">
        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center border border-indigo-500/20 text-indigo-400 shadow-inner">
          <i data-lucide="server" class="w-5 h-5"></i>
        </div>
        <h1 class="font-extrabold text-xl tracking-tight">SysDesign<span class="text-indigo-400">Flows</span></h1>
      </div>

      <div class="flex-1 overflow-y-auto p-6 pt-0 md:pt-2 space-y-8 custom-scrollbar pb-36">
        <!-- Progress Section -->
        <div>
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Your Mastery</h2>
            <div class="flex items-center gap-1">
              <input type="file" id="import-file" class="hidden" accept=".json" onchange="importProgress(event)" />
              <button onclick="triggerImport()" class="text-zinc-500 hover:text-indigo-400 transition-colors bg-zinc-900/50 hover:bg-indigo-500/10 p-1.5 rounded-md border border-zinc-800/50 hover:border-indigo-500/30" title="Import JSON Progress">
                <i data-lucide="upload" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="exportProgress()" class="text-zinc-500 hover:text-emerald-400 transition-colors bg-zinc-900/50 hover:bg-emerald-500/10 p-1.5 rounded-md border border-zinc-800/50 hover:border-emerald-500/30" title="Export JSON Data">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="resetProgress()" class="text-zinc-500 hover:text-rose-400 transition-colors bg-zinc-900/50 hover:bg-rose-500/10 p-1.5 rounded-md border border-zinc-800/50 hover:border-rose-500/30" title="Reset All Progress">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>

          <div class="relative flex items-center justify-center bg-zinc-900/50 rounded-2xl p-4 border border-zinc-800/50">
            <svg viewBox="0 0 36 36" class="circular-chart w-32 h-32">
              <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              <path class="circle stroke-indigo-500" stroke-dasharray="0, 100" id="progress-circle" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            </svg>
            <div class="absolute flex flex-col items-center justify-center">
              <span class="text-2xl font-bold text-white" id="progress-percent">0%</span>
              <span class="text-[10px] text-zinc-400 font-medium">Learned</span>
            </div>
          </div>
        </div>

        <!-- Stats Grid -->
        <div>
          <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-4">Topic Stats</h2>
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-zinc-900 rounded-xl p-3 border border-zinc-800 flex flex-col justify-center cursor-pointer hover:border-zinc-700 transition" onclick="setDiffFilter('All')">
              <span class="text-xl font-bold text-white" id="stat-total">0</span>
              <span class="text-[11px] text-zinc-400 uppercase tracking-wider font-semibold">Total Topics</span>
            </div>

            <!-- Easy Progress Card -->
            <div class="bg-emerald-500/5 rounded-xl p-3 border border-emerald-500/10 cursor-pointer hover:border-emerald-500/30 transition relative overflow-hidden group" onclick="setDiffFilter('Easy')">
              <div class="absolute bottom-0 left-0 h-1 bg-emerald-500/10 w-full"></div>
              <div class="absolute bottom-0 left-0 h-1 bg-emerald-500 transition-all duration-500" id="pb-easy" style="width: 0%"></div>
              <div class="flex flex-col relative z-10">
                <span class="text-xl font-bold text-emerald-400 flex items-baseline gap-1">
                  <span id="stat-easy-done">0</span>
                  <span class="text-xs text-emerald-500/50 font-medium">/ <span id="stat-easy">0</span></span>
                </span>
                <span class="text-[11px] text-emerald-500/70 uppercase tracking-wider font-semibold">Basic</span>
              </div>
            </div>

            <!-- Medium Progress Card -->
            <div class="bg-amber-500/5 rounded-xl p-3 border border-amber-500/10 cursor-pointer hover:border-amber-500/30 transition relative overflow-hidden group" onclick="setDiffFilter('Medium')">
              <div class="absolute bottom-0 left-0 h-1 bg-amber-500/10 w-full"></div>
              <div class="absolute bottom-0 left-0 h-1 bg-amber-500 transition-all duration-500" id="pb-medium" style="width: 0%"></div>
              <div class="flex flex-col relative z-10">
                <span class="text-xl font-bold text-amber-400 flex items-baseline gap-1">
                  <span id="stat-medium-done">0</span>
                  <span class="text-xs text-amber-500/50 font-medium">/ <span id="stat-medium">0</span></span>
                </span>
                <span class="text-[11px] text-amber-500/70 uppercase tracking-wider font-semibold">Intermediate</span>
              </div>
            </div>

            <!-- Hard Progress Card -->
            <div class="bg-rose-500/5 rounded-xl p-3 border border-rose-500/10 cursor-pointer hover:border-rose-500/30 transition relative overflow-hidden group" onclick="setDiffFilter('Hard')">
              <div class="absolute bottom-0 left-0 h-1 bg-rose-500/10 w-full"></div>
              <div class="absolute bottom-0 left-0 h-1 bg-rose-500 transition-all duration-500" id="pb-hard" style="width: 0%"></div>
              <div class="flex flex-col relative z-10">
                <span class="text-xl font-bold text-rose-400 flex items-baseline gap-1">
                  <span id="stat-hard-done">0</span>
                  <span class="text-xs text-rose-500/50 font-medium">/ <span id="stat-hard">0</span></span>
                </span>
                <span class="text-[11px] text-rose-500/70 uppercase tracking-wider font-semibold">Advanced</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Primary Filters Sidebar -->
        <div>
          <h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-4">Library</h2>
          <div class="flex flex-col gap-2">
            <button onclick="setStatusFilter('All')" id="btn-status-all" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors bg-zinc-800 text-white font-medium">
              <span class="flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4"></i> All Topics</span>
              <span id="count-all-badge" class="bg-zinc-700 px-2 py-0.5 rounded text-xs">0</span>
            </button>
            <button onclick="setStatusFilter('Done')" id="btn-status-done" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200">
              <span class="flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-emerald-500/70"></i> Mastered</span>
              <span id="count-done-badge" class="bg-zinc-800 px-2 py-0.5 rounded text-xs">0</span>
            </button>
            <button onclick="setStatusFilter('Todo')" id="btn-status-todo" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200">
              <span class="flex items-center gap-2"><i data-lucide="circle-dashed" class="w-4 h-4"></i> To Learn</span>
              <span id="count-todo-badge" class="bg-zinc-800 px-2 py-0.5 rounded text-xs">0</span>
            </button>

            <div class="border-t border-zinc-800/50 my-1 pt-2"></div>

            <button onclick="setStatusFilter('Favorites')" id="btn-status-favorites" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200">
              <span class="flex items-center gap-2 text-amber-500/80"><i data-lucide="star" class="w-4 h-4"></i> Favorites</span>
              <span id="count-fav-badge" class="bg-zinc-800 px-2 py-0.5 rounded text-xs">0</span>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#09090b] relative">
      <div id="sidebar-overlay" onclick="document.getElementById('sidebar').classList.add('-translate-x-full')" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

      <!-- Top Toolbar -->
      <div class="top-toolbar flex-shrink-0 border-b border-zinc-800 bg-zinc-950/50 backdrop-blur-md z-10 p-4 md:px-8 md:py-6">
        
        <!-- Breadcrumbs Navigation -->
        <div class="flex items-center gap-2 mb-4 text-sm font-medium text-zinc-400">
            <button onclick="goHome()" class="hover:text-white transition flex items-center gap-1.5">
                <i data-lucide="home" class="w-4 h-4"></i> Home
            </button>
            <span id="breadcrumb-separator" class="hidden text-zinc-600">/</span>
            <span id="breadcrumb-current" class="hidden text-indigo-400 font-semibold"></span>
        </div>

        <div class="flex flex-col xl:flex-row gap-4 items-start xl:items-center justify-between">
          <!-- Search -->
          <div class="relative w-full xl:max-w-md">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></i>
            <input type="text" id="searchInput" placeholder="Search topics, concepts, tags..." class="w-full pl-9 pr-12 py-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all shadow-sm" />
          </div>

          <!-- Sort & Actions -->
          <div class="flex flex-wrap items-center gap-2 w-full xl:w-auto">
            <select id="sortSelect" onchange="handleSortChange(event)" class="form-input py-2.5 bg-zinc-900 border-zinc-800 text-sm cursor-pointer hover:border-zinc-700 min-w-[140px] w-auto shrink-0 shadow-sm">
              <option value="default">Default Sort</option>
              <option value="diffAsc">Level: Basic -> Adv</option>
              <option value="diffDesc">Level: Adv -> Basic</option>
              <option value="titleAsc">Title: A to Z</option>
            </select>

            <button onclick="pickRandom()" class="p-2.5 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 hover:text-indigo-300 hover:bg-indigo-500/20 hover:border-indigo-500/40 transition flex-shrink-0 shadow-sm" title="Pick Random Unlearned Topic">
              <i data-lucide="dices" class="w-4 h-4"></i>
            </button>

            <button onclick="resetAllFilters()" class="p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 transition flex-shrink-0 shadow-sm" title="Clear Filters & Search">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Tags Filter Chips (Hidden when in Category View) -->
        <div id="tags-wrapper" class="mt-4 flex items-start gap-2 relative w-full hidden">
          <div id="tags-container" class="flex flex-wrap gap-2 overflow-hidden transition-all duration-300 max-h-[32px] flex-1">
            <!-- Injected via JS -->
          </div>
          <button onclick="toggleTagsExpand()" id="expand-tags-btn" class="hidden flex-shrink-0 px-2 py-1.5 rounded-lg text-xs font-medium border bg-zinc-900 text-zinc-400 border-zinc-800 hover:border-zinc-600 transition-all items-center justify-center h-[32px] z-10" title="Show more tags">
            <i data-lucide="chevron-down" id="expand-tags-icon" class="w-4 h-4 transition-transform duration-300"></i>
          </button>
        </div>
      </div>

      <!-- Main Scrollable Area -->
      <div class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar scroll-smooth" id="main-scroll-area">
        
        <!-- Category Grid View -->
        <div id="categoryGrid" class="max-w-6xl mx-auto pb-32 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Items injected by JS -->
        </div>

        <!-- Topic List View -->
        <div id="topicList" class="max-w-5xl mx-auto pb-32 hidden">
          <!-- Items injected by JS -->
        </div>
        
      </div>
    </main>

    <!-- Application Logic -->
    <script>

        { id: 602, title: "Design WhatsApp/Chat System", category: "Case Studies", difficulty: "Hard", tags: ["case-study", "websockets", "real-time"], resources: [{ name: "System Design Interview", url: "#" }] },
        { id: 603, title: "Design Netflix/YouTube", category: "Case Studies", difficulty: "Hard", tags: ["case-study", "streaming", "cdn"], resources: [{ name: "High Scalability", url: "#" }] }
      ];

      // Core State Management
      let topicData = [];
      let completedTopics = JSON.parse(localStorage.getItem("sysDesignTrackerCompleted") || "[]");
      let favoriteTopics = JSON.parse(localStorage.getItem("sysDesignTrackerFavorites") || "[]");
      let topicNotes = JSON.parse(localStorage.getItem("sysDesignTrackerNotes") || "{}");

      let globalUniqueTags = [];
      let isTagsExpanded = false;
      let activeNoteId = null;

      // Active App State
      let state = {
        activeCategory: null, // null means show Category Dashboard
        search: "",
        difficulty: "All",
        selectedTags: [],
        status: "All", // All, Done, Todo, Favorites
        sort: "default",
      };

      // History API Integration
      function navigateTo(category, replace = false) {
        if (state.activeCategory !== category || replace) {
            state.activeCategory = category;
            let url = window.location.pathname;
            if (category && !["Search Results", "Filtered Topics", "Sorted Topics", "Random Pick"].includes(category)) {
                url += "?category=" + encodeURIComponent(category);
            } else if (category) {
                url += "?view=" + encodeURIComponent(category);
            }
            if (replace) {
                history.replaceState({ activeCategory: category }, "", url);
            } else {
                history.pushState({ activeCategory: category }, "", url);
            }
            updateDashboard();
        }
      }

      window.addEventListener('popstate', (event) => {
        if (event.state && event.state.activeCategory !== undefined) {
            state.activeCategory = event.state.activeCategory;
        } else {
            state.activeCategory = null;
        }
        updateDashboard();
      });

      // DOM Elements
      const categoryGrid = document.getElementById("categoryGrid");
      const topicList = document.getElementById("topicList");
      const searchInput = document.getElementById("searchInput");
      const tagsWrapper = document.getElementById("tags-wrapper");

      // --- Custom Notifications & Modals ---
      function showToast(message, type = "success") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        const bg = type === "error" ? "bg-rose-500/20 border-rose-500/50 text-rose-200" : "bg-emerald-500/20 border-emerald-500/50 text-emerald-200";
        const icon = type === "error" ? "alert-circle" : "check-circle";

        toast.className = `px-4 py-3 rounded-lg border backdrop-blur-md shadow-lg transition-all duration-300 transform translate-y-10 opacity-0 flex items-center gap-2 text-sm font-medium ${bg}`;
        toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i> ${message}`;
        container.appendChild(toast);
        lucide.createIcons({ root: toast });

        setTimeout(() => toast.classList.remove("translate-y-10", "opacity-0"), 10);
        setTimeout(() => {
          toast.classList.add("translate-y-10", "opacity-0");
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      let confirmActionCb = null;
      function openConfirm(title, desc, actionCb) {
        document.getElementById("confirm-title").innerText = title;
        document.getElementById("confirm-desc").innerText = desc;
        confirmActionCb = actionCb;
        const modal = document.getElementById("confirm-modal");
        const content = document.getElementById("confirm-modal-content");
        modal.classList.remove("hidden");
        modal.classList.add("flex");
        setTimeout(() => content.classList.remove("scale-95"), 10);
      }

      function closeConfirm() {
        const modal = document.getElementById("confirm-modal");
        const content = document.getElementById("confirm-modal-content");
        content.classList.add("scale-95");
        setTimeout(() => {
          modal.classList.add("hidden");
          modal.classList.remove("flex");
        }, 200);
      }

      document.getElementById("confirm-btn").addEventListener("click", () => {
        if (confirmActionCb) confirmActionCb();
        closeConfirm();
      });

      // --- Advanced Features ---
      function triggerConfetti(x, y) {
        confetti({
          particleCount: 80, spread: 60,
          origin: { x: x / window.innerWidth, y: y / window.innerHeight },
          colors: ["#10b981", "#6366f1", "#fcd34d"],
        });
      }

      // --- Notes Logic ---
      function openNotes(id) {
        activeNoteId = String(id);
        const prob = topicData.find((p) => String(p.id) === activeNoteId);
        document.getElementById("notes-title").innerText = `Notes: ${prob ? prob.title : "Topic"}`;
        document.getElementById("notes-textarea").value = topicNotes[activeNoteId] || "";
        
        const modal = document.getElementById("notes-modal");
        const content = document.getElementById("notes-modal-content");
        modal.classList.remove("hidden"); modal.classList.add("flex");
        setTimeout(() => {
          content.classList.remove("scale-95");
          document.getElementById("notes-textarea").focus();
        }, 10);
      }

      function closeNotes() {
        const modal = document.getElementById("notes-modal");
        const content = document.getElementById("notes-modal-content");
        content.classList.add("scale-95");
        setTimeout(() => {
          modal.classList.add("hidden"); modal.classList.remove("flex");
          activeNoteId = null;
        }, 200);
      }

      function saveNotes() {
        if (!activeNoteId) return;
        const text = document.getElementById("notes-textarea").value.trim();
        if (text) { topicNotes[activeNoteId] = text; }
        else { delete topicNotes[activeNoteId]; }
        localStorage.setItem("sysDesignTrackerNotes", JSON.stringify(topicNotes));
        showToast("Note saved successfully.");
        closeNotes();
        renderMainContent();
      }

      // --- Action Logic ---
      function toggleFavorite(id) {
        const strId = String(id);
        if (favoriteTopics.includes(strId)) {
          favoriteTopics = favoriteTopics.filter((i) => i !== strId);
        } else {
          favoriteTopics.push(strId);
          showToast("Added to Favorites", "success");
        }
        localStorage.setItem("sysDesignTrackerFavorites", JSON.stringify(favoriteTopics));
        updateDashboard();
      }

      function toggleTopicStatus(id, event) {
        const strId = String(id);
        const isChecked = event.target.checked;

        if (isChecked) {
          if (!completedTopics.includes(strId)) {
            completedTopics.push(strId);
            showToast(`Topic Mastered!`, "success");
            const rect = event.target.getBoundingClientRect();
            triggerConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
          }
        } else {
          completedTopics = completedTopics.filter((i) => i !== strId);
        }

        localStorage.setItem("sysDesignTrackerCompleted", JSON.stringify(completedTopics));
        updateDashboard();
      }

      // Helpers
      function getDifficultyColor(difficulty) {
        switch (difficulty) {
          case "Easy": return "text-emerald-400 bg-emerald-400/10 border-emerald-500/20";
          case "Medium": return "text-amber-400 bg-amber-400/10 border-amber-500/20";
          case "Hard": return "text-rose-400 bg-rose-400/10 border-rose-500/20";
          default: return "text-zinc-400 bg-zinc-400/10 border-zinc-500/20";
        }
      }

      // Initialize
      async function initApp() {
        // Attempt to fetch custom JSON, otherwise fall back to default data
        try {
          const response = await fetch("data.json");
          if (!response.ok) throw new Error("Network response was not ok");
          const rawData = await response.json();
          topicData = rawData.map((item, index) => ({ ...item, originalIndex: index }));
        } catch (error) {
          console.warn("Could not fetch data.json. Falling back to default data...");
          topicData = defaultTopicData.map((item, index) => ({ ...item, originalIndex: index }));
        }
        
        extractMetadata();
        
        // Check URL parameters for initial load state
        const urlParams = new URLSearchParams(window.location.search);
        const cat = urlParams.get('category');
        const view = urlParams.get('view');
        const initialCategory = cat || view || null;
        
        navigateTo(initialCategory, true); // replace current history state

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (activeNoteId) closeNotes();
          }
        });
      }

      function extractMetadata() {
        const allTags = new Set();
        topicData.forEach((p) => { (p.tags || []).forEach((tag) => allTags.add(tag)); });
        globalUniqueTags = Array.from(allTags).sort();
      }

      // Update UI
      function updateDashboard() {
        updateSortDropdownLabels();
        updateStats();
        renderTagChips();
        updateBreadcrumbs();
        renderMainContent();
      }

      function updateSortDropdownLabels() {
        const select = document.getElementById("sortSelect");
        if (!select) return;
        if (state.activeCategory === null) {
            select.options[1].text = "Progress: Low -> High";
            select.options[2].text = "Progress: High -> Low";
        } else {
            select.options[1].text = "Level: Basic -> Adv";
            select.options[2].text = "Level: Adv -> Basic";
        }
      }

      function updateStats() {
        const counts = { Easy: 0, Medium: 0, Hard: 0, Done: 0, Todo: 0, Fav: favoriteTopics.length };
        const doneCounts = { Easy: 0, Medium: 0, Hard: 0 };

        topicData.forEach((p) => {
          if (counts[p.difficulty] !== undefined) counts[p.difficulty]++;
          if (completedTopics.includes(String(p.id))) {
            counts.Done++;
            if (doneCounts[p.difficulty] !== undefined) doneCounts[p.difficulty]++;
          } else {
            counts.Todo++;
          }
        });

        document.getElementById("stat-total").innerText = topicData.length;
        document.getElementById("stat-easy").innerText = counts.Easy;
        document.getElementById("stat-medium").innerText = counts.Medium;
        document.getElementById("stat-hard").innerText = counts.Hard;
        document.getElementById("stat-easy-done").innerText = doneCounts.Easy;
        document.getElementById("stat-medium-done").innerText = doneCounts.Medium;
        document.getElementById("stat-hard-done").innerText = doneCounts.Hard;

        const pEasy = counts.Easy ? (doneCounts.Easy / counts.Easy) * 100 : 0;
        const pMedium = counts.Medium ? (doneCounts.Medium / counts.Medium) * 100 : 0;
        const pHard = counts.Hard ? (doneCounts.Hard / counts.Hard) * 100 : 0;

        document.getElementById("pb-easy").style.width = `${pEasy}%`;
        document.getElementById("pb-medium").style.width = `${pMedium}%`;
        document.getElementById("pb-hard").style.width = `${pHard}%`;

        document.getElementById("count-all-badge").innerText = topicData.length;
        document.getElementById("count-done-badge").innerText = counts.Done;
        document.getElementById("count-todo-badge").innerText = counts.Todo;
        document.getElementById("count-fav-badge").innerText = counts.Fav;

        const percentage = topicData.length === 0 ? 0 : Math.round((counts.Done / topicData.length) * 100);
        document.getElementById("progress-percent").innerText = `${percentage}%`;
        document.getElementById("progress-circle").setAttribute("stroke-dasharray", `${percentage}, 100`);
      }

      function renderTagChips() {
        const container = document.getElementById("tags-container");
        const isAll = state.selectedTags.length === 0;

        let html = `<button onclick="toggleTagFilter('All')" class="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border transition-all ${isAll ? "bg-indigo-500/20 text-indigo-300 border-indigo-500/50" : "bg-zinc-900 text-zinc-400 border-zinc-800 hover:border-zinc-700"}">All Tags</button>`;

        globalUniqueTags.forEach((tag) => {
          const isActive = state.selectedTags.includes(tag);
          html += `<button onclick="toggleTagFilter('${tag}')" class="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border transition-all ${isActive ? "bg-indigo-500/20 text-indigo-300 border-indigo-500/50" : "bg-zinc-900 text-zinc-400 border-zinc-800 hover:border-zinc-700"}">${tag}</button>`;
        });
        container.innerHTML = html;

        setTimeout(() => {
          const btn = document.getElementById("expand-tags-btn");
          if (container.scrollHeight > 36) {

            btn.classList.add("hidden"); btn.classList.remove("flex");
          }
        }, 10);

      // Action Handlers
      searchInput.addEventListener("input", (e) => {
        state.search = e.target.value;
        // If typing a search, auto-switch to "Search Results" view
        if (state.search.length > 0 && state.activeCategory === null) {
            navigateTo("Search Results"); 
        } else if (state.search.length === 0 && state.activeCategory === "Search Results") {
            navigateTo(null);
        } else {
            updateDashboard();
        }
      });

      function setDiffFilter(diff) {
        state.difficulty = diff;
        if(state.activeCategory === null && diff !== "All") navigateTo("Filtered Topics");
        else updateDashboard();
      }

      function toggleTagFilter(tag) {
        if (tag === "All") state.selectedTags = [];
        else {
          const idx = state.selectedTags.indexOf(tag);
          if (idx > -1) state.selectedTags.splice(idx, 1);
          else state.selectedTags.push(tag);
        }
        if(state.activeCategory === null && state.selectedTags.length > 0) navigateTo("Filtered Topics");
        else updateDashboard();

        isTagsExpanded = !isTagsExpanded;
        const container = document.getElementById("tags-container");
        const icon = document.getElementById("expand-tags-icon");
        if (isTagsExpanded) {
          container.classList.remove("max-h-[32px]"); container.classList.add("max-h-[800px]");
          icon.classList.add("rotate-180");
        } else {
          container.classList.remove("max-h-[800px]"); container.classList.add("max-h-[32px]");
          icon.classList.remove("rotate-180");
        }

      function setStatusFilter(status) {
        state.status = status;
        ["all", "done", "todo", "favorites"].forEach((s) => {
          const btn = document.getElementById(`btn-status-${s}`);
          if (btn) {
            if (s.toLowerCase() === status.toLowerCase()) {
              btn.classList.replace("bg-transparent", "bg-zinc-800");

              btn.classList.remove("bg-zinc-800", "text-white", "font-medium");
              btn.classList.add("text-zinc-400");
            }
          }
        });
        if(state.activeCategory === null && status !== "All") navigateTo("Filtered Topics");
        else updateDashboard();

      function handleSortChange(e) {
        state.sort = e.target.value;
        updateDashboard();
      }

      function resetAllFilters() {
        state = { activeCategory: null, search: "", difficulty: "All", selectedTags: [], status: "All", sort: "default" };
        searchInput.value = "";
        document.getElementById("sortSelect").value = "default";
        setStatusFilter("All");
        navigateTo(null);

        navigateTo(null);
      }

      function openCategory(cat) {
        navigateTo(cat);
      }

        const sep = document.getElementById("breadcrumb-separator");
        const curr = document.getElementById("breadcrumb-current");

            sep.classList.remove("hidden");

      function resetProgress() {
        openConfirm("Reset All Data", "This will clear all completed topics, favorites, and notes. This cannot be undone.", () => {
          completedTopics = []; favoriteTopics = []; topicNotes = {};
          localStorage.removeItem("sysDesignTrackerCompleted");
          localStorage.removeItem("sysDesignTrackerFavorites");
          localStorage.removeItem("sysDesignTrackerNotes");
          updateDashboard();
          showToast("All data successfully reset.", "success");
        });
      }

      function exportProgress() {
        const exportData = { completed: completedTopics, favorites: favoriteTopics, notes: topicNotes };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
        const downloadAnchorNode = document.createElement("a");
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "sysdesign-flows-backup.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        showToast("Backup exported successfully", "success");
      }

      function triggerImport() { document.getElementById("import-file").click(); }

      function importProgress(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const imported = JSON.parse(e.target.result);
            if (imported && typeof imported === "object") {
              completedTopics = imported.completed || [];
              favoriteTopics = imported.favorites || [];
              topicNotes = imported.notes || {};
              localStorage.setItem("sysDesignTrackerCompleted", JSON.stringify(completedTopics));
              localStorage.setItem("sysDesignTrackerFavorites", JSON.stringify(favoriteTopics));
              localStorage.setItem("sysDesignTrackerNotes", JSON.stringify(topicNotes));
              showToast("Backup imported successfully!", "success");
            } else {
              showToast("Invalid file format.", "error"); return;
            }
            updateDashboard();
          } catch (err) { showToast("Error parsing file.", "error"); }
        };
        reader.readAsText(file);
        event.target.value = "";
      }

      function pickRandom() {
        const data = getFilteredAndSortedData().filter((p) => !completedTopics.includes(String(p.id)));
        if (data.length === 0) {
          showToast("No unlearned topics found with current filters!", "error"); return;
        }
        
        // Force topic view if not already
        if (state.activeCategory === null) {
            navigateTo("Random Pick");
        }

        const randomIdx = Math.floor(Math.random() * data.length);
        const selected = data[randomIdx];
        
        setTimeout(() => {
            const el = document.getElementById(`prob-${selected.id}`);
            if (el) {
                el.scrollIntoView({ behavior: "smooth", block: "center" });
                el.classList.add("ring-2", "ring-indigo-500", "bg-indigo-500/20");
                setTimeout(() => el.classList.remove("ring-2", "ring-indigo-500", "bg-indigo-500/20"), 1500);
                showToast(`Picked: ${selected.title}`, "success");
            }
        }, 100);
      }

      // Filtering & Render Logic
      function renderMainContent() {
        if (state.activeCategory === null) {
            categoryGrid.classList.remove("hidden");
            topicList.classList.add("hidden");
            renderCategories();
        } else {
            categoryGrid.classList.add("hidden");
            topicList.classList.remove("hidden");
            renderTopics();
        }
      }

      function renderCategories() {
        const cats = [...new Set(topicData.map(t => t.category))];
        
        let catStats = cats.map((catName, index) => {
            const catTopics = topicData.filter(t => t.category === catName);
            const total = catTopics.length;
            const done = catTopics.filter(t => completedTopics.includes(String(t.id))).length;
            const progress = total === 0 ? 0 : Math.round((done / total) * 100);
            return { catName, total, progress, originalIndex: index };
        });

        if (state.sort === "titleAsc") {
            catStats.sort((a, b) => a.catName.localeCompare(b.catName));
        } else if (state.sort === "diffAsc") {
            catStats.sort((a, b) => a.progress - b.progress);
        } else if (state.sort === "diffDesc") {
            catStats.sort((a, b) => b.progress - a.progress);
        } else {
            catStats.sort((a, b) => a.originalIndex - b.originalIndex);
        }

        let html = '';

        catStats.forEach(stat => {
            const { catName, total, progress } = stat;
            
            // Choose icon based on name roughly
            let icon = 'folder';
            if(catName.includes('Network')) icon = 'globe';
            else if(catName.includes('Data')) icon = 'database';
            else if(catName.includes('Distribute')) icon = 'share-2';
            else if(catName.includes('Scale')) icon = 'trending-up';
            else if(catName.includes('Arch')) icon = 'layout-template';

            html += `
                <div onclick="openCategory('${catName}')" class="group bg-zinc-900 border border-zinc-800 hover:border-indigo-500/50 rounded-2xl p-6 cursor-pointer transition-all duration-300 hover:shadow-lg hover:shadow-indigo-500/10 flex flex-col h-full animate-scale-up">
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center border border-indigo-500/20 group-hover:scale-110 transition-transform">
                            <i data-lucide="${icon}" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-bold px-2 py-1 bg-zinc-950 rounded text-zinc-500 border border-zinc-800">${total} Topics</span>
                    </div>
                    <h3 class="text-lg font-bold text-zinc-100 mb-2 group-hover:text-indigo-400 transition-colors">${catName}</h3>
                    <div class="mt-auto pt-4">
                        <div class="flex justify-between text-xs mb-1.5 font-medium">
                            <span class="text-zinc-400">Progress</span>
                            <span class="text-indigo-400">${progress}%</span>
                        </div>
                        <div class="w-full bg-zinc-950 rounded-full h-1.5 overflow-hidden border border-zinc-800">
                            <div class="bg-indigo-500 h-1.5 rounded-full transition-all duration-1000" style="width: ${progress}%"></div>
                        </div>
                    </div>
                </div>
            `;
        });
        categoryGrid.innerHTML = html;
        lucide.createIcons();
      }

      function getFilteredAndSortedData() {
        let filtered = topicData.filter((p) => {
          const searchStr = `${p.title} ${(p.tags || []).join(" ")} ${p.category}`.toLowerCase();
          const matchesSearch = searchStr.includes(state.search.toLowerCase());
          const matchesDiff = state.difficulty === "All" || p.difficulty === state.difficulty;
          const matchesTag = state.selectedTags.length === 0 || state.selectedTags.some((t) => (p.tags || []).includes(t));
          
          // Category matching logic: If not null, and not "Search Results", "Filtered Topics" or "Sorted Topics" (which act as "All")
          const isVirtualCat = ["Search Results", "Filtered Topics", "Sorted Topics", "Random Pick"].includes(state.activeCategory);
          const matchesCategory = state.activeCategory === null || isVirtualCat || p.category === state.activeCategory;

          const isDone = completedTopics.includes(String(p.id));
          const isFav = favoriteTopics.includes(String(p.id));
          const matchesStatus = state.status === "All" || (state.status === "Done" && isDone) || (state.status === "Todo" && !isDone) || (state.status === "Favorites" && isFav);

          return matchesSearch && matchesDiff && matchesTag && matchesCategory && matchesStatus;
        });

        const diffVal = { Easy: 1, Medium: 2, Hard: 3 };
        filtered.sort((a, b) => {
          if (state.sort === "titleAsc") return a.title.localeCompare(b.title);
          if (state.sort === "diffAsc") return (diffVal[a.difficulty] || 0) - (diffVal[b.difficulty] || 0);
          if (state.sort === "diffDesc") return (diffVal[b.difficulty] || 0) - (diffVal[a.difficulty] || 0);
          return a.originalIndex - b.originalIndex;
        });

        return filtered;
      }

      function renderTopics() {
        const data = getFilteredAndSortedData();

        if (data.length === 0) {
          topicList.innerHTML = `
            <div class="text-center py-20 px-4">
                <div class="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center mx-auto mb-4 text-zinc-600">
                    <i data-lucide="search-x" class="w-8 h-8"></i>
                </div>
                <h3 class="text-lg font-medium text-white mb-1">No topics found</h3>
                <p class="text-zinc-400 text-sm">Try adjusting your filters or search query.</p>
                <button onclick="resetAllFilters()" class="mt-4 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-sm transition-colors text-white">Clear Filters</button>
            </div>`;
          lucide.createIcons();
          return;
        }

        let html = `
            <div class="mb-3 px-1 text-sm font-medium text-zinc-500 flex items-center justify-between">
                <span>Showing ${data.length} topic${data.length !== 1 ? "s" : ""}</span>
            </div>
            <div class="flex flex-col gap-3 animate-fade-in">
        `;

        data.forEach((p) => {
          const strId = String(p.id);
          const isDone = completedTopics.includes(strId);
          const isFav = favoriteTopics.includes(strId);
          const hasNote = !!topicNotes[strId];
          const diffClass = getDifficultyColor(p.difficulty);
          const resources = p.resources || [];

          html += `
            <div id="prob-${p.id}" class="group relative flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-zinc-900/40 hover:bg-zinc-900 border border-zinc-800/60 hover:border-zinc-700 rounded-xl transition-all duration-300 gap-4">
                
                <!-- Left: Status & Title -->
                <div class="flex items-start sm:items-center gap-3 sm:gap-4 flex-1 min-w-0">
                    <div class="pt-0.5 sm:pt-0 flex items-center gap-3 shrink-0">
                        <input type="checkbox" class="custom-checkbox" ${isDone ? "checked" : ""} onchange="toggleTopicStatus('${p.id}', event)" title="Mark as learned">
                        <button onclick="toggleFavorite('${p.id}')" class="focus:outline-none" title="${isFav ? "Remove from favorites" : "Add to favorites"}">
                            <i data-lucide="star" class="w-4 h-4 transition-colors ${isFav ? "text-amber-400 fill-amber-400" : "text-zinc-600 hover:text-amber-400/50"}"></i>
                        </button>
                    </div>
                    <div class="flex flex-col gap-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <h3 class="text-sm sm:text-base font-semibold text-zinc-200 group-hover:text-white" title="${p.title}">
                                ${p.title}
                            </h3>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="px-1.5 py-0.5 rounded text-[10px] uppercase font-bold border ${diffClass}">
                                ${p.difficulty}
                            </span>
                            <div class="hidden sm:flex items-center gap-1.5 pl-1">
                                ${(p.tags || []).slice(0, 3).map(t => `<span class="text-[10px] text-zinc-500 bg-zinc-950 px-1.5 py-0.5 rounded border border-zinc-800/50">${t}</span>`).join("")}
                                ${(p.tags || []).length > 3 ? `<span class="text-[10px] text-zinc-600">...</span>` : ""}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Actions & Resources -->
                <div class="flex items-center gap-2 sm:opacity-80 sm:group-hover:opacity-100 transition-opacity pl-12 sm:pl-0 shrink-0 flex-wrap sm:flex-nowrap">
                    
                    <!-- Notes Button -->
                    <button onclick="openNotes('${p.id}')" class="p-2 bg-zinc-950 border ${hasNote ? "border-indigo-500/50 text-indigo-400" : "border-zinc-800 text-zinc-400 hover:border-zinc-600 hover:text-white"} rounded-lg transition-colors shadow-sm relative" title="${hasNote ? "Edit Notes" : "Add Notes"}">
                        <i data-lucide="sticky-note" class="w-4 h-4 ${hasNote ? "fill-indigo-500/20" : ""}"></i>
                        ${hasNote ? '<span class="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-indigo-500 ring-2 ring-zinc-900"></span>' : ""}
                    </button>
                    
                    <!-- Resources List -->
                    ${resources.map(res => `
                        <a href="${res.url}" target="_blank" class="flex items-center gap-1.5 px-3 py-2 bg-zinc-800/50 hover:bg-indigo-500/20 border border-zinc-700 hover:border-indigo-500/40 rounded-lg text-zinc-300 hover:text-indigo-300 text-xs font-medium transition-colors shadow-sm whitespace-nowrap">
                            <i data-lucide="book-open" class="w-3.5 h-3.5"></i> ${res.name}
                        </a>
                    `).join("")}
                </div>
            </div>
          `;
        });

        html += `</div>`;
        topicList.innerHTML = html;
        lucide.createIcons();
      }

      // Boot
      initApp();
    </script>
  </body>
</html>
